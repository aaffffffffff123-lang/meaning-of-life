<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>삶의 의미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#232323; --graphite:#6d6d6d; --red:#d9101a;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);overflow:hidden;overscroll-behavior:none}
body{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#black{position:fixed;inset:0;background:#111;opacity:0;pointer-events:none;transition:none}
#black.on{opacity:1}

.halo{text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff,0 0 10px #fff}
#caption{position:fixed;left:0;top:0;width:max-content;max-width:min(88vw,17em);
  background:#fff;border:4px solid var(--ink);border-radius:1.1em;box-shadow:6px 6px 0 var(--ink);padding:.5em .95em .56em;
  font-size:clamp(22px,3.3vw,38px);line-height:1.38;font-weight:700;letter-spacing:-0.01em;white-space:pre-line;word-break:keep-all;
  pointer-events:none;visibility:hidden;z-index:3;--tx:30%}
#caption::before,#caption::after{content:"";position:absolute;left:var(--tx);width:0;height:0;border-style:solid;transform:translateX(-50%) skewX(-18deg)}
#caption::before{top:100%;border-width:30px 15px 0 15px;border-color:var(--ink) transparent transparent transparent}
#caption::after{top:calc(100% - 4px);border-width:24px 10px 0 10px;border-color:#fff transparent transparent transparent;margin-top:-1px}
#caption.on{visibility:visible;animation:capIn .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes capIn{0%{opacity:0;scale:.6}100%{opacity:1;scale:1}}
#remark{position:fixed;left:50%;top:66%;max-width:min(88vw,34em);transform:translate(-50%,-50%) rotate(-.5deg);
  background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:.32em .68em .4em;
  font-size:clamp(18px,4.4vw,30px);font-weight:700;line-height:1.35;letter-spacing:-.01em;text-align:center;
  white-space:pre-line;word-break:keep-all;pointer-events:none;visibility:hidden;opacity:0;z-index:6}
#remark.on{visibility:visible;animation:remarkIn .2s ease-out both}
#remark.bad{color:var(--red);border-color:var(--red);box-shadow:5px 5px 0 var(--red)}
@keyframes remarkIn{0%{opacity:0;transform:translate(-50%,-43%) rotate(-.5deg) scale(.92)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-.5deg) scale(1)}}
#joke{position:fixed;left:50%;top:20%;width:max-content;max-width:min(88vw,24em);
  background:#fff;border:4px solid var(--ink);box-shadow:7px 7px 0 var(--ink);padding:.45em .8em .5em;
  font-size:clamp(19px,3.4vw,40px);font-weight:700;line-height:1.35;letter-spacing:-0.01em;white-space:pre-line;word-break:keep-all;transform:translateX(-50%) rotate(-0.8deg);
  pointer-events:none;display:none;z-index:3}
#joke.on{display:block;animation:jokeIn .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes jokeIn{0%{transform:translateX(-50%) rotate(-0.8deg) scale(.5);opacity:0}100%{transform:translateX(-50%) rotate(-0.8deg) scale(1);opacity:1}}
#hud{position:fixed;right:calc(var(--safe-r) + max(14px,2.4vw));top:calc(var(--safe-t) + max(12px,2.2vh));
  text-align:right;pointer-events:none;opacity:0;transition:opacity .2s}
#hud.on{opacity:1}
#score{font-size:clamp(20px,2.6vw,30px);font-weight:900;letter-spacing:-0.02em}
#score.hurt{animation:hurt .35s}
@keyframes hurt{0%,100%{transform:none;color:var(--ink)}25%{transform:translateX(-5px);color:var(--red)}60%{transform:translateX(4px);color:var(--red)}}
#kills{font-size:clamp(17px,2.1vw,24px);font-weight:900;letter-spacing:.04em;margin-top:1px}
#kills.bump{animation:killBump .28s cubic-bezier(.2,1.7,.4,1)}
@keyframes killBump{0%{transform:scale(.55);color:var(--red)}65%{transform:scale(1.2);color:var(--ink)}100%{transform:none}}
#timer{font-size:clamp(14px,1.6vw,18px);font-weight:700;color:var(--ink);margin-top:2px}
#timer.low{color:var(--red);animation:blink 1s steps(2) infinite}
#finalCountdown{position:fixed;left:50%;top:43%;transform:translate(-50%,-50%) rotate(-3deg);
  font-size:clamp(72px,14vw,160px);line-height:1;font-weight:900;font-variant-numeric:tabular-nums;
  color:var(--red);text-shadow:3px 3px 0 #fff,-3px -3px 0 #fff,0 0 18px #fff;
  pointer-events:none;display:none;z-index:1}
#finalCountdown.on{display:block}
#finalCountdown.pulse{animation:finalTick .36s cubic-bezier(.18,1.45,.4,1) both}
@keyframes finalTick{from{opacity:.5;transform:translate(-50%,-50%) rotate(-3deg) scale(1.55)}to{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}}
#timer.penalty{animation:timePenalty .42s ease-out}
@keyframes timePenalty{0%,100%{transform:none}25%{transform:translateX(-7px) scale(1.28);color:var(--red)}55%{transform:translateX(5px) scale(1.12);color:var(--red)}}
@keyframes blink{50%{opacity:.35}}
#ammo{margin-top:8px;display:none;pointer-events:auto;cursor:pointer;line-height:1}
#ammo.on{display:block;animation:hudIn .25s cubic-bezier(.2,1.6,.4,1) both}
#ammoN{font-size:clamp(30px,4.2vw,52px);font-weight:900;letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
#ammoM{font-size:clamp(14px,1.7vw,20px);font-weight:700;color:var(--graphite);margin-left:3px}
#ammo.empty #ammoN{color:var(--red)}
#ammoBar{display:flex;gap:3px;justify-content:flex-end;margin-top:4px}
#ammoBar i{display:block;width:clamp(6px,.8vw,9px);height:clamp(12px,1.6vw,18px);background:var(--ink);border-radius:2px 2px 1px 1px}
#ammoBar i.off{background:transparent;border:2px solid var(--ink);opacity:.35}
#reloading{font-size:clamp(13px,1.5vw,17px);font-weight:700;color:var(--red);margin-top:3px;display:none}
#ammo.rel #reloading{display:block}
#ammo.rel #ammoBar{opacity:.4}
@keyframes hudIn{0%{transform:scale(.3) rotate(6deg);opacity:0}100%{transform:none;opacity:1}}

#cross{position:fixed;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none;display:none;z-index:2}
#cross.on{display:block;animation:hudIn .25s cubic-bezier(.2,1.6,.4,1) both}
#cross svg{display:block;width:64px;height:64px;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff)}
.hitmark{position:absolute;transform:translate(-50%,-50%);font-size:44px;font-weight:900;color:var(--ink);line-height:1;animation:hm .16s ease-out forwards}
.hitmark.red{color:var(--red)}
@keyframes hm{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(-50%,-50%) scale(1.25);opacity:0}}
.tapring{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border:3px solid var(--ink);border-radius:50%;animation:tr .22s ease-out forwards}
@keyframes tr{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.2);opacity:0}}

#hint{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) rotate(-1.5deg);background:#fff;border:4px solid var(--ink);
  box-shadow:7px 7px 0 var(--ink);padding:.35em .8em .4em;white-space:nowrap;text-align:center;
  font-size:clamp(28px,5.4vw,60px);font-weight:900;letter-spacing:-0.03em;line-height:1.2;pointer-events:none;display:none}
#hint small{display:block;font-size:.42em;font-weight:700;letter-spacing:0;color:var(--graphite);margin-top:.15em}
#hint.on{display:block;animation:hintIn .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes hintIn{0%{transform:translate(-50%,-50%) rotate(-1.5deg) scale(.3)}100%{transform:translate(-50%,-50%) rotate(-1.5deg) scale(1)}}
#big{position:fixed;left:50%;top:14%;transform:translate(-50%,-50%) rotate(-2deg);background:#fff;border:5px solid var(--red);color:var(--red);
  box-shadow:9px 9px 0 var(--red);padding:.25em .7em .3em;white-space:nowrap;
  font-size:clamp(44px,9vw,120px);font-weight:900;letter-spacing:-0.04em;line-height:1.1;pointer-events:none;display:none}
#big.on{display:block;animation:bigIn .5s cubic-bezier(.2,1.7,.4,1) both,bigShake .5s .1s}
@keyframes bigIn{0%{transform:translate(-50%,-50%) rotate(-2deg) scale(.2)}100%{transform:translate(-50%,-50%) rotate(-2deg) scale(1)}}
@keyframes bigShake{0%,100%{margin-left:0}20%{margin-left:-8px}40%{margin-left:7px}60%{margin-left:-5px}80%{margin-left:4px}}

.pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(24px,3.4vw,40px);
  animation:pop .9s ease-out forwards;white-space:nowrap}
.pop.good{color:var(--ink)} .pop.bad{color:var(--red)} .pop.zero{color:var(--graphite)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.tang{position:absolute;font-weight:500;font-size:clamp(22px,3.4vw,40px);transform:translate(-50%,-50%) rotate(var(--r));
  animation:tang .55s ease-out forwards;white-space:nowrap}
@keyframes tang{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(.7)}20%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-90%) rotate(var(--r)) scale(1)}}
.ono{position:absolute;font-weight:900;font-size:var(--s,48px);transform:translate(-50%,-50%) rotate(var(--r));letter-spacing:-0.04em;
  animation:ono .7s cubic-bezier(.2,1.5,.4,1) forwards;white-space:nowrap;color:var(--ink)}
@keyframes ono{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(.3)}18%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1.15)}
  70%{opacity:1;transform:translate(-50%,-60%) rotate(var(--r)) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) rotate(var(--r)) scale(1)}}
.head{position:absolute;transform:translate(-50%,-50%) rotate(-3deg);background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  padding:.1em .45em .15em;font-weight:900;font-size:clamp(16px,2vw,24px);animation:headIn .7s ease-out forwards;white-space:nowrap}
@keyframes headIn{0%{opacity:0;transform:translate(-50%,-50%) rotate(-3deg) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1.1)}
  75%{opacity:1;transform:translate(-50%,-70%) rotate(-3deg)}100%{opacity:0;transform:translate(-50%,-90%) rotate(-3deg)}}
.flash{position:absolute;width:120px;height:120px;transform:translate(-50%,-50%) rotate(var(--r)) scale(var(--sc,1));animation:flash .12s steps(2) forwards}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid var(--ink);border-radius:14px 14px 14px 3px;
  padding:4px 10px;font-size:clamp(13px,1.5vw,17px);font-weight:500;white-space:nowrap}
.lens{position:absolute;width:var(--w);height:var(--w);transform:translate(-50%,-50%) rotate(var(--r));animation:lens .9s ease-in forwards}
@keyframes lens{0%{opacity:.85}60%{opacity:.7}100%{opacity:0}}

#edge{position:fixed;inset:0;pointer-events:none}
.eh{position:absolute;width:44px;height:44px;border:3px solid var(--ink);border-radius:50%;background:#fff;box-shadow:3px 3px 0 var(--ink);
  font-size:22px;line-height:38px;text-align:center;transform:translate(-50%,-50%);display:none}
.eh b{position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;font-size:12px;line-height:18px;width:18px;border-radius:9px;font-weight:900}
.eh.on{display:block}
.eh.L{left:calc(var(--safe-l) + 30px)} .eh.R{right:calc(var(--safe-r) + 30px);transform:translate(50%,-50%)}

#kk{position:fixed;left:calc(var(--safe-l) + 2vw);right:calc(var(--safe-r) + 2vw);top:calc(var(--safe-t) + 1.5vh);
  font-size:clamp(24px,4.6vw,56px);line-height:1.2;font-weight:400;letter-spacing:.02em;word-break:break-all;pointer-events:none}

#board{position:fixed;right:calc(var(--safe-r) + 4vw);bottom:calc(var(--safe-b) + max(196px,27vh));transform:rotate(-1.2deg);background:#fff;border:3px solid var(--ink);
  padding:18px 26px 16px;min-width:min(86vw,360px);pointer-events:none;opacity:0;transition:opacity .3s;
  box-shadow:6px 6px 0 var(--ink)}
#board.on{opacity:1}
#board .row{display:flex;justify-content:space-between;gap:24px;font-size:clamp(16px,2vw,20px);font-weight:500;padding:3px 0}
#board .row b{font-weight:900;font-variant-numeric:tabular-nums}
#board .sum{border-top:2px solid var(--ink);margin-top:8px;padding-top:8px;font-size:clamp(22px,3vw,30px)}
#board .sum b{font-size:1.25em}
#board .red{color:var(--red)}
#board .sum s{color:var(--graphite)}
#board .sum .nil{font-size:.62em;font-weight:700;margin-left:.2em}

#title{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-start;
  padding:calc(var(--safe-t) + max(28px,7vh)) calc(var(--safe-r) + 6vw) calc(var(--safe-b) + 6vh) calc(var(--safe-l) + 6vw);
  background:linear-gradient(180deg,rgba(255,255,255,.94) 0%,rgba(255,255,255,.86) 55%,rgba(255,255,255,0) 100%);transition:opacity .35s}
#title.off{opacity:0;pointer-events:none}
#title h1{margin:0 0 6px;font-size:clamp(48px,11vw,128px);font-weight:900;letter-spacing:-0.045em;line-height:1}
.btn{margin-top:26px;align-self:flex-start;font:inherit;font-size:clamp(18px,2.2vw,24px);font-weight:900;color:var(--ink);background:#fff;
  border:3px solid var(--ink);padding:12px 28px;box-shadow:5px 5px 0 var(--ink);cursor:pointer;transform:rotate(-1deg)}
.btn:active{transform:translate(4px,4px) rotate(-1deg);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--red);outline-offset:4px}
#againBox{position:fixed;right:calc(var(--safe-r) + 4vw);bottom:calc(var(--safe-b) + max(24px,4vh));display:none;flex-direction:column;align-items:flex-end;pointer-events:none}
#againBox.on{display:flex;animation:hudIn .4s cubic-bezier(.2,1.6,.4,1) both}
#againBox .t{font-size:clamp(38px,7vw,78px);font-weight:900;letter-spacing:-0.045em;line-height:1;margin:0 2px 8px 0}
#again{position:static;display:block;margin:0;transform:rotate(-1deg);pointer-events:auto}
#again:active{transform:translate(4px,4px) rotate(-1deg)}

#fire{position:fixed;right:calc(var(--safe-r) + max(22px,4vw));bottom:calc(var(--safe-b) + max(26px,5vh));width:92px;height:92px;border-radius:50%;
  border:4px solid var(--ink);background:#fff;box-shadow:5px 5px 0 var(--ink);display:none;align-items:center;justify-content:center;z-index:4;
  font:inherit;font-size:34px;font-weight:900;color:var(--red);letter-spacing:-0.04em;padding:0;touch-action:none;cursor:pointer}
#fire.on{display:flex;animation:hudIn .25s cubic-bezier(.2,1.6,.4,1) both}
#fire.down{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink);background:#ffe9ea}
#fire.empty{color:var(--graphite)}
#mute{position:fixed;left:calc(var(--safe-l) + 12px);bottom:calc(var(--safe-b) + 12px);width:44px;height:44px;border:3px solid var(--ink);background:#fff;
  box-shadow:3px 3px 0 var(--ink);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;z-index:5}
#mute:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#mute svg{width:26px;height:26px;display:block}
#mute .x{display:none}
#mute.off .x{display:block} #mute.off .w{display:none}
#unsupported{display:none;margin-top:24px;max-width:30em;font-size:clamp(16px,2vw,20px);font-weight:700;line-height:1.55;word-break:keep-all}
#unsupported.on{display:block}
@media (orientation:landscape){#remark{top:72%;max-width:min(74vw,34em)}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fx"></div>
<div id="edge"><div class="eh L">✋<b>1</b></div><div class="eh R">✋<b>1</b></div></div>
<div id="kk" class="halo"></div>
<div id="caption" class="halo"></div>
<div id="remark" aria-live="polite"></div>
<div id="hud" class="halo">
  <div id="score">점수 0</div><div id="kills">0 KILL</div><div id="timer"></div>
  <div id="ammo"><span id="ammoN">10</span><span id="ammoM">/ 10</span><div id="ammoBar"></div><div id="reloading">장전 중…</div></div>
</div>
<div id="cross"><svg viewBox="0 0 64 64"><g fill="none" stroke="#232323" stroke-width="3" stroke-linecap="round"><path d="M32 3c-3 2-8 6-8 6M32 61c2-4 6-8 6-8"/><circle cx="32" cy="32" r="17"/><path d="M32 6v10M32 48v10M6 32h10M48 32h10"/></g><circle cx="32" cy="32" r="3.2" fill="#232323"/></svg></div>
<div id="finalCountdown" aria-live="off"></div>
<div id="hint" class="halo"></div>
<div id="joke"></div>
<div id="big"></div>
<div id="board"></div>
<div id="black"></div>
<div id="againBox"><div class="t halo">삶의 의미</div><button id="again" class="btn">다시 물어보기</button></div>
<button id="fire" aria-label="발사">탕</button>
<button id="mute" title="소리 켜기/끄기" aria-label="소리 켜기/끄기">
  <svg viewBox="0 0 24 24" fill="none" stroke="#232323" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path class="w" d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>
<div id="title">
  <h1>삶의 의미</h1>
  <button id="start" class="btn">시작하기</button>
  <div id="unsupported" role="status">이 브라우저에서는 3D 화면을 열 수 없습니다.<br>Chrome 또는 Samsung Internet에서 다시 열어주세요.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
let pagePaused=document.hidden,pageResumeSeq=0;
const sleep=ms=>new Promise(r=>{let left=ms,last=performance.now(),seq=pageResumeSeq;const f=()=>{const n=performance.now();if(seq!==pageResumeSeq){seq=pageResumeSeq;last=n;}if(!window.__freeze&&!pagePaused)left-=n-last;last=n;if(left<=0)r();else setTimeout(f,Math.min(40,Math.max(4,left)));};setTimeout(f,Math.min(40,ms));});
const IS_TOUCH=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
const PI=Math.PI;

/* ================= renderer ================= */
const DPR=Math.min(window.devicePixelRatio||1,2);
let renderer;
try{
  if(!window.THREE)throw new Error('THREE unavailable');
  renderer=new THREE.WebGLRenderer({antialias:true});
}catch(err){
  const u=$('#unsupported'),start=$('#start');
  if(u)u.classList.add('on');
  if(start)start.style.display='none';
  const mute=$('#mute');if(mute)mute.style.display='none';
  console.error('3D renderer unavailable',err);
  return;
}
renderer.setPixelRatio(DPR);
renderer.setClearColor(0xffffff,1);
$('#stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,1,0.04,80);
camera.rotation.order='YXZ';
scene.add(camera);
let W=1,H=1;

const U={
  uLight:{value:new THREE.Vector3(-0.35,0.75,0.75).normalize()},
  uDpr:{value:DPR},
  uInk:{value:new THREE.Color('#232323')},
  uPaper:{value:new THREE.Color('#ffffff')},
  uRed:{value:new THREE.Color('#d9101a')}
};
const LIGHT_CROWD=new THREE.Vector3(-0.35,0.75,0.75).normalize();
const LIGHT_SPEAKER=new THREE.Vector3(0.4,0.8,-0.65).normalize();

/* ================= shaders ================= */
const hatchVS=`
#ifdef INST
attribute float aTone; attribute float aHit; attribute float aSplat; attribute vec2 aSeed;
#endif
uniform float uTone;

const hullCache=new Map();
function hullGeo(geo){
  if(hullCache.has(geo))return hullCache.get(geo);
  const g=geo.index?geo.toNonIndexed():geo.clone();
  const p=g.attributes.position,n=g.attributes.normal,acc=new Map(),keys=[];
  const r=v=>Math.round(v*1e4);
  for(let i=0;i<p.count;i++){
    const k=r(p.getX(i))+','+r(p.getY(i))+','+r(p.getZ(i));keys.push(k);
    const nk=Math.round(n.getX(i)*100)+','+Math.round(n.getY(i)*100)+','+Math.round(n.getZ(i)*100);
    let e=acc.get(k);if(!e){e={s:new Set(),x:0,y:0,z:0};acc.set(k,e);}
    if(!e.s.has(nk)){e.s.add(nk);e.x+=n.getX(i);e.y+=n.getY(i);e.z+=n.getZ(i);}
  }
  for(let i=0;i<p.count;i++){const e=acc.get(keys[i]);n.setXYZ(i,e.x,e.y,e.z);}
  n.needsUpdate=true;hullCache.set(geo,g);return g;
}

function M(x,y,z,rx,ry,rz,sx,sy,sz){

    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0,ry||0,rz||0)),
    new THREE.Vector3(sx===undefined?1:sx,sy===undefined?1:sy,sz===undefined?1:sz));

function merge(parts){
  const pos=[],nor=[],uv=[];
  for(const [g0,m] of parts){
    const g=g0.index?g0.toNonIndexed():g0.clone();

    const p=g.attributes.position.array,n=g.attributes.normal.array;
    const u=g.attributes.uv?g.attributes.uv.array:new Float32Array(p.length/3*2);
    for(let i=0;i<p.length;i++){pos.push(p[i]);nor.push(n[i]);}
    for(let i=0;i<u.length;i++)uv.push(u[i]);
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  out.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  return out;
}

    }

  setFace(f){if(f!==this.face){this.face=f;crowd.dirtyFace=true;}}
  kill(dir,correct,part){
    const keep=correct?this.raisedSide():0;
    this.alive=false;this.action=null;this.look=null;
    const r=Math.random();
    const type=r<0.5?'back':r<0.78?'crumple':'side';
    this.fall={t:0,type,dir:Math.random()<0.5?-1:1,dur:rnd(0.42,0.55),limpL:rnd(0.5,1.5),limpR:rnd(0.5,1.5),wrong:!correct,keep,

  }

    return pts;
  }
}

  shadow.frustumCulled=false;group.add(shadow);

    for(let s=0;s<2;s++){up.g.attributes.aTone.array[j*2+s]=p.shirt;fore.g.attributes.aTone.array[j*2+s]=p.shirt;hand.g.attributes.aTone.array[j*2+s]=0.02;}
    if(p.hair!=='bald') hair[p.hair].g.attributes.aTone.array[p.hairSlot]=p.hairTone;
    faceG.attributes.aFace.array[j]=p.face;
    pool.setMatrixAt(j,ZERO);

function syncCrowd(){
  const c=crowd;
  c.people.forEach((p,j)=>{
    const r=p.rig;r.root.updateMatrixWorld(true);
    c.legs.m.setMatrixAt(j,r.legs.matrixWorld);c.torso.m.setMatrixAt(j,r.torso.matrixWorld);
    c.head.m.setMatrixAt(j,r.head.matrixWorld);c.face.setMatrixAt(j,r.head.matrixWorld);
    if(p.hair!=='bald') c.hair[p.hair].m.setMatrixAt(p.hairSlot,r.head.matrixWorld);
    r.arms.forEach((a,s)=>{c.up.m.setMatrixAt(j*2+s,a.up.matrixWorld);c.fore.m.setMatrixAt(j*2+s,a.fo.matrixWorld);c.hand.m.setMatrixAt(j*2+s,a.ha.matrixWorld);});
    if(p.poolPos){c.pool.setMatrixAt(j,M(p.poolPos.x,p.poolPos.y,p.poolPos.z,0,p.poolRot,0,p.poolS,1,p.poolS*0.9));}
  });
  for(const k of ['legs','torso','head','up','fore','hand']) c[k].m.instanceMatrix.needsUpdate=true;
  for(const s in c.hair) c.hair[s].m.instanceMatrix.needsUpdate=true;
  c.face.instanceMatrix.needsUpdate=true;c.pool.instanceMatrix.needsUpdate=true;
  if(c.dirtyFace){c.people.forEach((p,j)=>c.faceG.attributes.aFace.array[j]=p.face);c.faceG.attributes.aFace.needsUpdate=true;c.dirtyFace=false;}
  if(c.dirtyHit){c.people.forEach((p,j)=>c.torso.g.attributes.aHit.array[j]=p.alive?0:p.hit);c.torso.g.attributes.aHit.needsUpdate=true;c.dirtyHit=false;}

}

function paintLectureBoard(cv,narrow=false){
  const c=cv.getContext('2d'),w=cv.width,h=cv.height;
  c.clearRect(0,0,w,h);c.fillStyle='#f1f4ef';c.fillRect(0,0,w,h);
  // 옅은 지운 자국을 남겨 인쇄 간판이 아니라 실제 화이트보드처럼 보이게 한다.
  c.save();c.globalAlpha=0.055;c.strokeStyle='#68716e';c.lineCap='round';
  for(let i=0;i<11;i++){
    const y=70+i*43+(i%3)*7;c.lineWidth=10+(i%4)*4;c.beginPath();
    c.moveTo(95+(i%2)*80,y);c.bezierCurveTo(w*0.32,y-18,w*0.68,y+20,w-110-(i%3)*55,y-3);c.stroke();
  }
  c.restore();
  const markerText=(text,cx,cy,size,maxWidth)=>{
    const chars=[...text];c.font=`800 ${size}px 'Noto Sans KR','Noto Sans CJK KR',sans-serif`;
    let widths=chars.map(ch=>c.measureText(ch).width),total=widths.reduce((a,b)=>a+b,0);
    if(total>maxWidth){size*=maxWidth/total;c.font=`800 ${size}px 'Noto Sans KR','Noto Sans CJK KR',sans-serif`;widths=chars.map(ch=>c.measureText(ch).width);total=widths.reduce((a,b)=>a+b,0);}
    let x=cx-total/2;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#242827';
    chars.forEach((ch,i)=>{const cw=widths[i];c.save();c.translate(x+cw/2,cy+Math.sin(i*1.9)*4);c.rotate((i%3-1)*0.009);c.fillText(ch,0,0);c.globalAlpha=0.14;c.fillText(ch,1.4,-1);c.restore();x+=cw;});
  };
  // 보드가 Y축으로 뒤집혀 있어 캔버스의 왼쪽이 화면에서는 오른쪽으로 보인다.
  // 손을 든 강연자와 겹치지 않는 보드 오른쪽에 질문을 배치한다.
  const cx=w*(narrow?0.27:0.30);
  if(narrow){markerText('삶의',cx,h*0.38,145,w*0.30);markerText('의미란?',cx,h*0.66,145,w*0.36);}
  else markerText('삶의 의미란?',cx,h*0.46,165,w*0.50);
  c.save();c.strokeStyle='rgba(36,40,39,.78)';c.lineWidth=7;c.lineCap='round';c.beginPath();
  c.moveTo(w*(narrow?0.08:0.05),h*(narrow?0.83:0.69));c.quadraticCurveTo(cx,h*(narrow?0.86:0.72),w*(narrow?0.50:0.55),h*(narrow?0.82:0.68));c.stroke();c.restore();
  if(!narrow){c.save();c.globalAlpha=.58;c.fillStyle='#343a38';c.font="600 46px 'Noto Sans KR','Noto Sans CJK KR',sans-serif";c.textAlign='center';c.fillText('행복   ·   목적   ·   가치',cx,h*0.85);c.restore();}
}

let koVoice=null,speechCurrent=null,speechQueue=[],speechWatchdog=null,speechPrimed=false;
function findVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();koVoice=vs.find(v=>/ko[-_]KR/i.test(v.lang))||vs.find(v=>/^ko/i.test(v.lang))||null;}
function speechDuck(on){if(A.master&&A.ctx&&!A.muted)A.master.gain.setTargetAtTime(on?0.58:0.85,A.ctx.currentTime,0.025);}
function stopSpeech(){
  speechQueue.length=0;clearTimeout(speechWatchdog);speechWatchdog=null;
  if(speechCurrent){speechCurrent.onend=null;speechCurrent.onerror=null;speechCurrent=null;}
  if('speechSynthesis' in window)try{speechSynthesis.cancel();}catch(e){}
  speechDuck(false);
}
function pumpSpeech(){
  if(speechCurrent||!speechQueue.length||A.muted||document.hidden||!('speechSynthesis' in window))return;
  findVoice();const item=speechQueue.shift(),u=new SpeechSynthesisUtterance(item.text);speechCurrent=u;
  u.lang=koVoice&&koVoice.lang?koVoice.lang:'ko-KR';if(koVoice)u.voice=koVoice;
  const shout=!!item.o.shout;
  u.rate=item.o.rate??(shout?1.34:1.05);
  u.pitch=item.o.pitch??(shout?1.1:1);
  u.volume=item.o.volume??1;
  let doneOnce=false;const done=()=>{if(doneOnce)return;doneOnce=true;clearTimeout(speechWatchdog);speechWatchdog=null;if(speechCurrent===u)speechCurrent=null;speechDuck(false);setTimeout(pumpSpeech,55);};
  u.onend=done;u.onerror=done;speechDuck(true);
  speechWatchdog=setTimeout(done,Math.max(2800,item.text.length*230));
  try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){done();}
}
function say(text,o){
  o=o||{};
  if(A.muted||!('speechSynthesis' in window))return;
  speechQueue.push({text,o});if(speechQueue.length>4)speechQueue.splice(0,speechQueue.length-4);pumpSpeech();
}
function unlockSpeech(){
  if(speechPrimed||A.muted||!('speechSynthesis' in window))return;speechPrimed=true;findVoice();
  try{speechSynthesis.resume();const u=new SpeechSynthesisUtterance('.');u.lang=koVoice&&koVoice.lang?koVoice.lang:'ko-KR';if(koVoice)u.voice=koVoice;u.volume=0;u.rate=10;speechSynthesis.speak(u);}catch(e){}
}
if('speechSynthesis' in window){findVoice();speechSynthesis.onvoiceschanged=()=>{findVoice();pumpSpeech();};}

const ray=new THREE.Raycaster();

function rayCapsule(o,d,a,b,r){

function pickTargets(k,viewShare){
  const free=crowd.people.filter(p=>p.alive&&!p.action&&!p.look);
  const inv=free.filter(p=>inView(p)),out=free.filter(p=>!inView(p));
  const chosen=[];
  const take=(arr,n)=>{for(let i=0;i<n&&arr.length;i++){const j=Math.floor(Math.random()*arr.length);chosen.push(arr.splice(j,1)[0]);}};
  take(inv,Math.round(k*viewShare));take(out,k-chosen.length);take(inv,k-chosen.length);
  return chosen;
}
function scheduleCrowd(dt){
  const prog=1-G.timeLeft/PLAY_TIME;
  const scaredMode=G.hits+G.misses>=14;
  const alive=crowd.people.filter(p=>p.alive);
  const raised=alive.filter(p=>p.isRaised()).length;
  if(raised===0)G.noRaiseT+=dt;else G.noRaiseT=0;
  if(G.noRaiseT>2.6&&G.waveT>1.2)G.waveT=0.4;
  G.spawnT-=dt;
  if(G.spawnT<=0){
    G.spawnT=rnd(2.4,3.8);
    const c=pickTargets(1,0.6);
    if(c.length){const p=c[0];
      if(Math.random()<0.62)p.start('raise',{hold:lerp(4.2,3.0,prog)*rnd(0.85,1.15),hes:scaredMode&&Math.random()<0.5});
      else{const opts=['scratch','wave','half','fix'];if(prog>0.3)opts.push('stretch');p.start(pick(opts));}}
  }
  if(G.timeLeft<=8&&!G.finalDone)G.waveT=0;
  G.waveT-=dt;
  if(G.waveT<=0){
    G.waveN++;
    let k,hold;
    if(G.timeLeft<=8&&!G.finalDone){G.finalDone=true;k=portrait?12:15;hold=9;G.waveT=999;}
    else{k=Math.round(lerp(4,6,prog))+(Math.random()<0.4?1:0);hold=lerp(4.8,3.1,prog);G.waveT=rnd(7.2,8.8);}
    const chosen=pickTargets(k,0.7);
    chosen.forEach((p,i)=>{setTimeout(()=>{if(p.alive&&!p.action&&G.state==='play')p.start('raise',{hold:hold*rnd(0.85,1.15),hes:scaredMode&&Math.random()<0.45});},i*90+rnd(0,350));});
    if(Math.random()<0.45){const dec=pickTargets(1,0.8);if(dec.length)setTimeout(()=>{if(dec[0].alive&&!dec[0].action&&G.state==='play')dec[0].start(pick(['stretch','scratch','wave']));},rnd(200,900));}
  }

}

  pPos.fill(-999);pLife.fill(0);clearDecals();casings.forEach(c=>c.m.visible=false);magDrops.forEach(d=>scene.remove(d.m));magDrops.length=0;
  VM.rel=-1;VM.recoil=0;
  portrait=layoutPortrait();buildCrowd(portrait);
  speaker.mode='mic';
}
function lockPointer(){if(IS_TOUCH)return;try{const p=renderer.domElement.requestPointerLock();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function unlockPointer(){try{if(document.pointerLockElement)document.exitPointerLock();}catch(e){}}
async function runIntro(){
  const tok=++G.token;const alive=()=>tok===G.token;
  resetGame();
  G.state='intro';
  $('#title').classList.add('off');hudEl.classList.remove('on');
  speaker.mode='raise';setShot('front');
  sFeedback();murmurTo(0,0.2);
  await sleep(450);if(!alive())return;
  const q='나는 삶의 의미를 모르겠다\n하시는 분 계시나요?';
  setPhase('q');caption(q);say('나는 삶의 의미를 모르겠다 하시는 분, 계시나요?',{rate:1.0});
  await sleep(3200);if(!alive())return;
  captionOff();speaker.mode='mic';setShot('over');murmurTo(0.02,0.3);setPhase('hands');
  const ppl=crowd.people.slice().sort(()=>Math.random()-0.5);
  const n=Math.floor(ppl.length*0.3);
  G.introRaisers=ppl.slice(0,n);
  for(let k=0;k<n;k++){const p=ppl[k];setTimeout(()=>{if(alive()&&p.alive&&!p.action)p.start('raise',{hold:99});},rnd(150,1100));}
  await sleep(2400);if(!alive())return;
  speaker.mode='reload';speaker.relT=0;speaker.racked=false;speaker.clacked=false;setShot('close');murmurTo(0,0.1);setPhase('reload');
  await sleep(1250);if(!alive())return;
  speaker.mode='angry';speaker.aim.copy(cam.pos);
  setPhase('angry');bigLine('그럼 죽어!!!');say('그럼! 죽어!',{shout:true});shake=1.4;
  await sleep(1300);if(!alive())return;
  bigOff();blackEl.classList.add('on');
  await sleep(90);if(!alive())return;
  setShot('pov');speaker.mode='aim';VM.drawT=0;if(!locked)cv.style.cursor='default';
  G.introRaisers.forEach(p=>{if(p.alive&&p.action&&p.action.type==='raise'){const a=p.action;a.hold=Math.max(0,a.t-a.rise)+rnd(6.8,8.6);a.dur=a.rise+a.hold+0.8;}});
  G.state='play';blackEl.classList.remove('on');hudEl.classList.add('on');murmurTo(0.03,0.6);setPhase('play');
  timerEl.textContent='준비';
  sUi(700);crossEl.classList.add('on');
  setTimeout(()=>{if(alive()){ammoEl.classList.add('on');if(IS_TOUCH)fireEl.classList.add('on');sUi(900);}},160);
  setTimeout(()=>{if(alive()&&!G.timerStarted){hintEl.innerHTML='손 든 사람을 쏘세요<small>'+(IS_TOUCH?'화면 드래그: 조준 · 탕 버튼: 발사':'마우스: 조준 · 클릭: 발사 · R: 장전')+'<br>엉뚱한 사람을 쏘면 −'+WRONG_TIME_PENALTY+'초</small>';hintEl.classList.add('on');sUi(1100);}},320);
  setTimeout(()=>{if(alive())beginPlayTimer();},3000);
}
function buildBoard(){
  boardEl.innerHTML=`<div class="row"><span>죽인 사람</span><b><span id="deadN">0</span>명</b></div>
    <div class="row red"><span>삶의 의미를 아는데 죽은 사람</span><b><span id="wrongN">0</span>명</b></div>
    <div class="row sum"><span>점수</span><b id="resultScore">0</b></div>`;
}
function updateBoardNumbers(){
  if(!G.boardReady)return;
  const dead=$('#deadN'),wrong=$('#wrongN'),score=$('#resultScore');
  if(dead)dead.textContent=G.hits+G.misses+G.postKills;
  if(wrong)wrong.textContent=G.misses;
  if(score)score.textContent=G.score;
}
async function countBoardValue(el,getTarget,suffix,duration,basePitch,tok){
  if(!el)return false;
  el.textContent='0'+suffix;await sleep(120);if(tok!==G.token)return false;
  const first=getTarget();
  if(first===0){el.textContent='0'+suffix;return true;}
  const steps=Math.max(7,Math.min(10,Math.abs(first)));
  for(let i=1;i<=steps;i++){
    if(tok!==G.token)return false;
    el.textContent=Math.round(getTarget()*i/steps)+suffix;
    sUi(basePitch+i*34);
    await sleep(duration/steps);
  }
  return true;
}
async function countBoard(tok){
  G.boardReady=false;
  if(!await countBoardValue($('#deadN'),()=>G.hits+G.misses+G.postKills,'',680,560,tok))return false;
  await sleep(100);if(tok!==G.token)return false;
  if(!await countBoardValue($('#wrongN'),()=>G.misses,'',500,720,tok))return false;
  await sleep(100);if(tok!==G.token)return false;
  if(!await countBoardValue($('#resultScore'),()=>G.score,'',620,880,tok))return false;
  G.boardReady=true;updateBoardNumbers();sDing();return true;
}
async function runEnding(){
  const tok=++G.token;const alive=()=>tok===G.token;
  stopSpeech();
  G.state='endTalk';updateFinalCountdown(0);hintEl.classList.remove('on');crossEl.classList.remove('on');fireEl.classList.remove('on','down');aimPtrs.clear();unlockPointer();cv.style.cursor='crosshair';
  clearRemark();
  edgeL.classList.remove('on');edgeR.classList.remove('on');
  crowd.people.forEach(p=>{p.action=null;p.look=null;p.scared=0;});
  murmurTo(0,0.3);
  await sleep(650);if(!alive())return;
  hudEl.classList.remove('on');ammoEl.classList.remove('on');blackEl.classList.add('on');
  await sleep(80);if(!alive())return;
  speaker.mode='spread';setShot('reverse');blackEl.classList.remove('on');
  setPhase('joke');jokeOn('ㅋㅋ 농담입니다.');
  say('크크, 농담입니다.',{rate:1.02,pitch:1.1});
  await sleep(1600);if(!alive())return;
  jokeUpdate('삶의 의미 같은 건 없구요 아무나 죽인 거였습니다~~^^');
  say('삶의 의미 같은 건 없구요, 아무나 죽인 거였습니다~',{rate:1.02,pitch:1.1});
  await sleep(4200);if(!alive())return;
  captionOff();
  const survivors=crowd.people.filter(p=>p.alive);
  survivors.forEach(p=>{p.laughing=true;p.laughFace=Math.random()<0.55?FACE.laughB:FACE.laughA;});
  speaker.mode='laugh';setShot('over');
  G.state='endLaugh';
  sLaugh(Math.min(16,survivors.length)+1,9);if(survivors.length>0)sApplause(8,0.35);
  kkLoop(tok,survivors.length);
  buildBoard();
  await sleep(900);if(!alive())return;
  boardEl.classList.add('on');
  if(!await countBoard(tok)||!alive())return;
  await sleep(550);if(!alive())return;
  $('#againBox').classList.add('on');
}
async function kkLoop(tok,n){
  const glyphs=n>0?['ㅋ','ㅋ','ㅋ','ㄱ','ㄲ','ㅋ','ㄱ','ㅣ']:['ㅋ'];
  const lines=n>0?(portrait?6:3):1,per=n>0?(portrait?12:22):6;
  const rows=[];for(let r=0;r<lines;r++){const d=document.createElement('div');kkEl.appendChild(d);rows.push(d);}
  for(let r=0;r<lines;r++)for(let i=0;i<per;i++){
    if(tok!==G.token)return;
    rows[r].textContent+=(i%9===8&&n>0)?' ':pick(glyphs);
    await sleep(n>0?55:180);
  }
}

$('#start').addEventListener('click',()=>{audioInit();findVoice();lockPointer();runIntro();unlockSpeech();});
$('#again').addEventListener('click',()=>{audioInit();findVoice();lockPointer();runIntro();unlockSpeech();});
$('#mute').addEventListener('click',e=>{e.stopPropagation();setMuted(!A.muted);});
$('#mute').classList.toggle('off',A.muted);
ammoEl.addEventListener('click',e=>{e.stopPropagation();if(G.state==='play'&&G.ammo<MAG)startReload();});
window.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'||e.key==='ㄱ'){if(G.state==='play'&&G.ammo<MAG)startReload();}
  if(e.key==='m'||e.key==='M'||e.key==='ㅡ'){setMuted(!A.muted);}
});

/* ================= input ================= */
const cv=renderer.domElement;
let locked=false;
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;cv.style.cursor=locked?'none':(G.state==='play'?'default':'crosshair');});
document.addEventListener('pointerlockerror',()=>{locked=false;});
function lookDelta(dx,dy,sens){cam.yawT=clamp(cam.yawT-dx*sens,-YAW_MAX,YAW_MAX);cam.pitchT=clamp(cam.pitchT-dy*sens,PITCH_MIN,PITCH_MAX);}
const canShoot=()=>G.state==='play'||G.state==='endLaugh';
const aiming=()=>G.state==='play'&&cam.mode==='pov';
const touchSens=()=>(IS_TOUCH?1.55:1.4)/Math.max(320,W);
// 조준 손가락: 여러 개 동시에 받음. 드래그는 조준만 하고 절대 쏘지 않음.
const aimPtrs=new Map();
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(locked){if(canShoot())fire(W/2,H/2);return;}
  if(G.state==='endLaugh'){fire(e.clientX,e.clientY);return;}
  if(G.state!=='play')return;
  aimPtrs.set(e.pointerId,{x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t0:e.timeStamp,drag:false,btn:false});
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
});
function aimMove(e){
  const a=aimPtrs.get(e.pointerId);if(!a)return;
  const dx=e.clientX-a.x,dy=e.clientY-a.y;a.x=e.clientX;a.y=e.clientY;
  if(!a.drag&&Math.hypot(e.clientX-a.x0,e.clientY-a.y0)>6)a.drag=true;
  if(a.drag&&aiming())lookDelta(dx,dy,touchSens());
}
cv.addEventListener('pointermove',e=>{
  if(locked){if(G.state==='play')lookDelta(e.movementX||0,e.movementY||0,0.0016);return;}
  aimMove(e);
});
function aimEnd(e){
  const a=aimPtrs.get(e.pointerId);if(!a)return;
  aimPtrs.delete(e.pointerId);
  try{e.target.releasePointerCapture(e.pointerId);}catch(err){}
  if(a.btn){fireEl.classList.remove('down');return;}
  if(G.state!=='play')return;
  // 모바일은 드래그로만 조준하고 탕 버튼으로 발사. 데스크톱 클릭 발사는 유지한다.
  const desktopPointer=e.pointerType==='mouse'||(!e.pointerType&&!IS_TOUCH);
  if(!a.drag&&desktopPointer&&e.timeStamp-a.t0<350)fire(W/2,H/2);
  if(!a.drag&&desktopPointer&&!locked)lockPointer();
}
cv.addEventListener('pointerup',aimEnd);
cv.addEventListener('pointercancel',e=>{aimPtrs.delete(e.pointerId);});
// 탕 버튼: 누르는 순간 발사, 누른 채로 끌면 그 손가락으로도 조준
const fireEl=$('#fire');
fireEl.addEventListener('contextmenu',e=>e.preventDefault());
fireEl.addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();
  if(G.state!=='play')return;
  fireEl.classList.add('down');
  aimPtrs.set(e.pointerId,{x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t0:e.timeStamp,drag:false,btn:true});
  try{fireEl.setPointerCapture(e.pointerId);}catch(err){}
  fire(W/2,H/2);
});
fireEl.addEventListener('pointermove',aimMove);
fireEl.addEventListener('pointerup',aimEnd);
fireEl.addEventListener('pointercancel',e=>{aimPtrs.delete(e.pointerId);fireEl.classList.remove('down');});

/* ================= loop ================= */
let clockT=0,lastNow=performance.now();
function pausePage(){
  if(pagePaused)return;
  pagePaused=true;aimPtrs.clear();fireEl.classList.remove('down');
  stopSpeech();
  if(A.ctx&&A.ctx.state==='running')A.ctx.suspend().catch(()=>{});
}
function resumePage(){
  if(!pagePaused)return;
  pagePaused=false;pageResumeSeq++;lastNow=performance.now();
  if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume().catch(()=>{});
  if('speechSynthesis' in window)try{speechSynthesis.resume();}catch(e){}
}
document.addEventListener('visibilitychange',()=>document.hidden?pausePage():resumePage());
window.addEventListener('pagehide',pausePage);
window.addEventListener('pageshow',()=>{if(!document.hidden)resumePage();});
document.addEventListener('pointerdown',()=>{if(!document.hidden&&A.ctx&&A.ctx.state==='suspended')A.ctx.resume().catch(()=>{});},{capture:true});
function frame(now){
  const rdt=Math.min(0.05,(now-lastNow)/1000);lastNow=now;
  let dt=rdt;if(G.freeze>0){G.freeze-=rdt;dt=0;}
  clockT+=dt;
  if(G.state==='play'){
    if(G.timerStarted){
      G.timeLeft-=rdt;const tl=Math.max(0,Math.ceil(G.timeLeft));timerEl.textContent='남은 시간 '+tl;updateFinalCountdown(tl);
      if(tl<=10){timerEl.classList.add('low');if(tl<G.lastTick&&tl>0)sTimer();}G.lastTick=tl;
      scheduleCrowd(dt);
      const alive=crowd.people.filter(p=>p.alive).length;
      if(G.timeLeft<=0||alive<=Math.max(4,crowd.N*0.08)){G.timeLeft=0;runEnding();}
    }
  }else if(G.state==='title'){
    G.spawnT-=dt;if(G.spawnT<=0){G.spawnT=rnd(0.5,1.2);const f=crowd.people.filter(p=>!p.action);if(f.length){const p=pick(f);p.start(pick(['scratch','wave','fix','half','raise','clap']));}}
  }
  for(const p of crowd.people)p.update(dt,clockT);
  syncCrowd();
  speakerUpdate(dt,clockT);
  updateCamera(rdt);
  vmUpdate(rdt,dt);
  updateParticles(dt);updateCasings(dt);updateMagDrops(dt);
  dropMat.uniforms.uScale.value=(H*DPR)/(2*Math.tan(camera.fov*PI/360));
  updateBubbles();updateEdge();updateCaption();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
W=window.innerWidth;H=window.innerHeight;
portrait=layoutPortrait();
buildCrowd(portrait);
resize();setShot('over');setAmmo();
requestAnimationFrame(frame);
window.__G=G;window.__cam=camera;window.__camS=cam;window.__fire=fire;window.__crowd=()=>crowd;window.__runIntro=runIntro;window.__runEnding=runEnding;window.__setShot=setShot;window.__VM=VM;window.__speaker=speaker;
window.__look=(y,p)=>{cam.yaw=cam.yawT=y;cam.pitch=cam.pitchT=p;};window.__reload=startReload;
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{
  const bt=stageGroup.userData.whiteboardTex;if(bt){paintLectureBoard(bt.image,portrait);bt.needsUpdate=true;}});
})();



</script>
