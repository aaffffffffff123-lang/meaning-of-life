<style>
:root{
  --paper:#ffffff; --ink:#232323; --graphite:#6d6d6d; --red:#d9101a;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);overflow:hidden;overscroll-behavior:none}
body{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#black{position:fixed;inset:0;background:#111;opacity:0;pointer-events:none;transition:none}
#black.on{opacity:1}

.halo{text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff,0 0 10px #fff}
#caption{position:fixed;left:0;top:0;width:max-content;max-width:min(88vw,17em);
  background:#fff;border:4px solid var(--ink);border-radius:1.1em;box-shadow:6px 6px 0 var(--ink);padding:.5em .95em .56em;
  font-size:clamp(22px,3.3vw,38px);line-height:1.38;font-weight:700;letter-spacing:-0.01em;white-space:pre-line;word-break:keep-all;

#endif

const hatchFS=`
uniform vec3 uLight; uniform float uDpr; uniform vec3 uInk; uniform vec3 uPaper; uniform vec3 uRed;
varying vec3 vN; varying float vTone; varying vec3 vLocal; varying float vHit; varying float vSplat; varying vec2 vSeed;
float hl(float c,float sp,float w){ float d=abs(fract(c/sp)-0.5)*sp; return 1.0-smoothstep(w*0.5,w*0.5+0.9,d); }
void main(){
  vec3 n=normalize(vN); if(!gl_FrontFacing) n=-n;
  float diff=max(dot(n,normalize(uLight)),0.0);
  float light=clamp(diff*0.7+0.36+0.1*n.y,0.0,1.0);
  float dark=clamp((1.0-light)*0.72+vTone,0.0,1.0);
  vec2 p=gl_FragCoord.xy/uDpr;
  float wob=sin(p.y*0.045)*2.2+sin(p.x*0.031)*1.6;
  float ink=0.0;
  ink=max(ink,hl(p.x+p.y+wob,6.5,1.05)*smoothstep(0.27,0.34,dark));
  ink=max(ink,hl(p.x-p.y+wob,6.5,1.05)*smoothstep(0.5,0.57,dark));
  ink=max(ink,hl(p.x*0.35+p.y+wob,4.4,1.25)*smoothstep(0.7,0.77,dark));
  ink=max(ink,smoothstep(0.86,0.98,dark)*0.92);
  vec3 base=uPaper;
  float front=step(0.0,vLocal.z);
  if(vHit>0.0){
    vec2 c=vec2(vSeed.x*0.07,0.36+vSeed.y*0.06);
    vec2 d=vLocal.xy-c;
    float ang=atan(d.y,d.x);
    float r=(0.11+0.03*sin(ang*5.0+vSeed.x*9.0)+0.02*sin(ang*11.0+vSeed.y*7.0))*vHit;
    float m=(1.0-smoothstep(r-0.012,r,length(d)))*front;
    float dx=vLocal.x-c.x-0.03*sin(vSeed.y*20.0);
    float drip=(1.0-smoothstep(0.011,0.016,abs(dx)))*step(vLocal.y,c.y)*step(c.y-0.3*vHit,vLocal.y)*front;
    float dx2=vLocal.x-c.x+0.05*cos(vSeed.x*17.0);
    float drip2=(1.0-smoothstep(0.008,0.012,abs(dx2)))*step(vLocal.y,c.y)*step(c.y-0.18*vHit,vLocal.y)*front;
    m=max(m,max(drip,drip2));
    base=mix(base,uRed,m);
    ink*=(1.0-0.55*m);
  }
  if(vSplat>0.0){
    float k=min(vSplat,1.0);
    vec2 c1=vec2(0.08*sin(vSeed.x*13.0),0.31+0.1*cos(vSeed.y*7.0));
    vec2 c2=vec2(-0.07*cos(vSeed.y*11.0),0.16+0.08*sin(vSeed.x*5.0));
    vec2 d1=vLocal.xy-c1; vec2 d2=vLocal.xy-c2;
    float r1=(0.021+0.008*sin(atan(d1.y,d1.x)*6.0+vSeed.y*3.0))*k;
    float r2=(0.015+0.007*cos(atan(d2.y,d2.x)*5.0+vSeed.x*4.0))*k;
    float m2=max(1.0-smoothstep(r1-0.007,r1,length(d1)),1.0-smoothstep(r2-0.006,r2,length(d2)))*front;
    base=mix(base,uRed,m2);
    ink*=(1.0-0.5*m2);
  }

}`;

const hullCache=new Map();
function hullGeo(geo){
  if(hullCache.has(geo))return hullCache.get(geo);
  const g=geo.index?geo.toNonIndexed():geo.clone();
  const p=g.attributes.position,n=g.attributes.normal,acc=new Map(),keys=[];
  const r=v=>Math.round(v*1e4);
  for(let i=0;i<p.count;i++){
    const k=r(p.getX(i))+','+r(p.getY(i))+','+r(p.getZ(i));keys.push(k);
    const nk=Math.round(n.getX(i)*100)+','+Math.round(n.getY(i)*100)+','+Math.round(n.getZ(i)*100);
    let e=acc.get(k);if(!e){e={s:new Set(),x:0,y:0,z:0};acc.set(k,e);}
    if(!e.s.has(nk)){e.s.add(nk);e.x+=n.getX(i);e.y+=n.getY(i);e.z+=n.getZ(i);}
  }
  for(let i=0;i<p.count;i++){const e=acc.get(keys[i]);n.setXYZ(i,e.x,e.y,e.z);}
  n.needsUpdate=true;hullCache.set(geo,g);return g;
}

function M(x,y,z,rx,ry,rz,sx,sy,sz){

    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0,ry||0,rz||0)),
    new THREE.Vector3(sx===undefined?1:sx,sy===undefined?1:sy,sz===undefined?1:sz));

function merge(parts){
  const pos=[],nor=[],uv=[];
  for(const [g0,m] of parts){
    const g=g0.index?g0.toNonIndexed():g0.clone();
    if(m) g.applyMatrix4(m);
    const p=g.attributes.position.array,n=g.attributes.normal.array;
    const u=g.attributes.uv?g.attributes.uv.array:new Float32Array(p.length/3*2);
    for(let i=0;i<p.length;i++){pos.push(p[i]);nor.push(n[i]);}
    for(let i=0;i<u.length;i++)uv.push(u[i]);
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  out.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  return out;
}

function paintLectureBoard(cv,narrow=false){
  const c=cv.getContext('2d'),w=cv.width,h=cv.height;
  c.clearRect(0,0,w,h);c.fillStyle='#f1f4ef';c.fillRect(0,0,w,h);

  for(let i=0;i<11;i++){

    c.moveTo(95+(i%2)*80,y);c.bezierCurveTo(w*0.32,y-18,w*0.68,y+20,w-110-(i%3)*55,y-3);c.stroke();
  }

  const markerText=(text,cx,cy,size,maxWidth)=>{
    const chars=[...text];c.font=`800 ${size}px 'Noto Sans KR','Noto Sans CJK KR',sans-serif`;
    let widths=chars.map(ch=>c.measureText(ch).width),total=widths.reduce((a,b)=>a+b,0);
    if(total>maxWidth){size*=maxWidth/total;c.font=`800 ${size}px 'Noto Sans KR','Noto Sans CJK KR',sans-serif`;widths=chars.map(ch=>c.measureText(ch).width);total=widths.reduce((a,b)=>a+b,0);}
    let x=cx-total/2;c.textAlign='center';c.textBaseline='middle';c.fillStyle='#242827';
    chars.forEach((ch,i)=>{const cw=widths[i];c.save();c.translate(x+cw/2,cy+Math.sin(i*1.9)*4);c.rotate((i%3-1)*0.009);c.fillText(ch,0,0);c.globalAlpha=0.14;c.fillText(ch,1.4,-1);c.restore();x+=cw;});
  };
  // 보드가 Y축으로 뒤집혀 있어 캔버스의 왼쪽이 화면에서는 오른쪽으로 보인다.
  // 손을 든 강연자와 겹치지 않는 보드 오른쪽에 질문을 배치한다.
  const cx=w*(narrow?0.27:0.30);
  if(narrow){markerText('삶의',cx,h*0.38,145,w*0.30);markerText('의미란?',cx,h*0.66,145,w*0.36);}
  else markerText('삶의 의미란?',cx,h*0.46,165,w*0.50);
  c.save();c.strokeStyle='rgba(36,40,39,.78)';c.lineWidth=7;c.lineCap='round';c.beginPath();

  if(!narrow){c.save();c.globalAlpha=.58;c.fillStyle='#343a38';c.font="600 46px 'Noto Sans KR','Noto Sans CJK KR',sans-serif";c.textAlign='center';c.fillText('행복   ·   목적   ·   가치',cx,h*0.85);c.restore();}
}

let koVoice=null,speechCurrent=null,speechCurrentItem=null,speechQueue=[],speechWatchdog=null,speechPrimed=false;
function findVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();koVoice=vs.find(v=>/ko[-_]KR/i.test(v.lang))||vs.find(v=>/^ko/i.test(v.lang))||null;}

function stopSpeech(){

  if(speechCurrent){speechCurrent.onstart=null;speechCurrent.onend=null;speechCurrent.onerror=null;speechCurrent=null;}
  if(speechCurrentItem){speechCurrentItem.resolve(false);speechCurrentItem=null;}
  if(shouldCancel)try{speechSynthesis.cancel();}catch(e){}
  speechDuck(false);

  if(speechCurrent||!speechQueue.length||A.muted||document.hidden||!('speechSynthesis' in window))return;
  findVoice();const item=speechQueue.shift(),u=new SpeechSynthesisUtterance(item.text);speechCurrent=u;speechCurrentItem=item;
  u.lang='ko-KR';
  const shout=!!item.o.shout;
  u.rate=item.o.rate??(shout?1.34:1.05);
  u.pitch=item.o.pitch??(shout?1.1:1);
  u.volume=item.o.volume??1;
  let doneOnce=false,started=false;
  const done=()=>{if(doneOnce)return;doneOnce=true;clearTimeout(speechWatchdog);speechWatchdog=null;
    if(!started&&item.o.onStart)item.o.onStart();
    if(speechCurrent===u)speechCurrent=null;if(speechCurrentItem===item)speechCurrentItem=null;
    speechDuck(false);item.resolve(started);setTimeout(pumpSpeech,55);};
  u.onstart=()=>{if(doneOnce)return;if(!started){started=true;clearTimeout(speechWatchdog);speechWatchdog=setTimeout(()=>{if(speechCurrent===u){try{speechSynthesis.cancel();}catch(e){}done();}},Math.max(5000,item.text.length*350));if(item.o.onStart)item.o.onStart();}};

  speechWatchdog=setTimeout(()=>{if(speechCurrent===u){try{speechSynthesis.cancel();}catch(e){}done();}},item.o.maxStartDelay??Math.max(5000,item.text.length*350));
  try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){done();}
}

  return new Promise(resolve=>{speechQueue.push({text,o,resolve});
    if(speechQueue.length>4)speechQueue.splice(0,speechQueue.length-4).forEach(item=>item.resolve(false));pumpSpeech();});
}

/* ================= hit testing ================= */
const ray=new THREE.Raycaster();
function rayFromScreen(sx,sy){ray.setFromCamera(new THREE.Vector2(sx/W*2-1,-(sy/H)*2+1),camera);return ray.ray;}
function raySphere(o,d,c,r){const oc=_v1.copy(o).sub(c);const b=oc.dot(d);const cc=oc.dot(oc)-r*r;const disc=b*b-cc;if(disc<0)return -1;const sq=Math.sqrt(disc);const t=-b-sq;if(t>0)return t;return (-b+sq)>0?0:-1;}
function rayCapsule(o,d,a,b,r){
  const ab=_v1.copy(b).sub(a),w=_v2.copy(o).sub(a);
  const A=d.dot(d),B=d.dot(ab),C=ab.dot(ab),D=d.dot(w),E=ab.dot(w);
  let t,s;const den=A*C-B*B;
  if(den<1e-7){s=0;t=-D/A;}else{t=(B*E-C*D)/den;s=(E+t*B)/C;}
  s=clamp(s,0,1);t=(s*B-D)/A;if(t<0){t=0;s=clamp(E/C,0,1);}
  const p=_v3.copy(o).addScaledVector(d,t).sub(a).addScaledVector(ab,-s);
  const dist=p.length();if(dist>r)return -1;
  return Math.max(0,t-Math.sqrt(r*r-dist*dist));
}
function personHit(o,d){
  let best=null;
  for(const p of crowd.people){
    if(!p.alive)continue;
    for(const b of p.bodyParts()){
      const t=b.kind==='s'?raySphere(o,d,b.c,b.r):rayCapsule(o,d,b.a,b.b,b.r);
      if(t>=0&&(!best||t<best.t))best={t,p,part:b.part};
    }
  }
  return best;
}
function assistTarget(sx,sy){
  const R=IS_TOUCH?44:30;let best=null;
  for(const p of crowd.people){
    if(!p.alive||!p.isRaised())continue;
    for(const [v,part] of p.aimPoints()){
      const s=toScreen(v);if(s.z>1)continue;
      const dist=Math.hypot(s.x-sx,s.y-sy);
      if(dist<R&&(!best||dist<best.dist))best={dist,p,v,part:part==='hand'?'torso':part};
    }
  }
  if(!best)return null;
  const q=best.p.aimPoints().find(a=>a[1]===best.part);
  return {p:best.p,point:q?q[0]:best.v,part:best.part};
}
function envHit(o,d){
  const c=crowd;let best=null;
  const add=(t,p,n,kind)=>{if(t>0.05&&(!best||t<best.t))best={t,p,n,kind};};
  const at=t=>new THREE.Vector3().copy(o).addScaledVector(d,t);
  const wz=c.backZ+0.15;
  if(d.z<0){const t=(wz-o.z)/d.z;const p=at(t);if(Math.abs(p.x)<c.width/2+15&&p.y>-1&&p.y<5.05)add(t,p,new THREE.Vector3(0,0,1),'wall');}
  for(const sgn of [1,-1]){if(d.x*sgn>0){const t=(sgn*c.sideX-o.x)/d.x;const p=at(t);if(p.z>c.backZ&&p.z<7&&p.y>-1&&p.y<5.05)add(t,p,new THREE.Vector3(-sgn,0,0),'wall');}}
  if(d.y>0){const t=(5.05-o.y)/d.y;const p=at(t);if(p.z>c.backZ&&p.z<7)add(t,p,new THREE.Vector3(0,-1,0),'ceil');}
  for(let r=0;r<c.rows;r++){const y=-0.5+r*0.33,z0=-0.7-r*1.18;
    if(d.y<0){const t=(y-o.y)/d.y;const p=at(t);if(Math.abs(p.z-z0)<=0.59&&Math.abs(p.x)<c.width/2)add(t,p,new THREE.Vector3(0,1,0),'floor');}
    if(r>0&&d.z<0){const z=z0+0.59;const t=(z-o.z)/d.z;const p=at(t);if(p.y>=y-0.33&&p.y<=y&&Math.abs(p.x)<c.width/2)add(t,p,new THREE.Vector3(0,0,1),'wall');}}
  if(d.y<0){const t=(-0.5-o.y)/d.y;const p=at(t);if(p.z>-0.11&&p.z<0.7)add(t,p,new THREE.Vector3(0,1,0),'floor');}
  if(d.z>0){const t=(6.65-o.z)/d.z;const p=at(t);if(p.y>0&&p.y<9)add(t,p,new THREE.Vector3(0,0,-1),'wall');}
  return best;
}

  }

    fxDiv('ono halo',hs.x+rnd(-50,50),hs.y-rnd(10,50),pick(headshot?ONO_HEAD:ONO_HIT),720,{'--r':rnd(-22,22)+'deg','--s':sizePx+'px'});

function pickTargets(k,viewShare){
  const free=crowd.people.filter(p=>p.alive&&!p.action&&!p.look);
  const inv=free.filter(p=>inView(p)),out=free.filter(p=>!inView(p));
  const chosen=[];
  const take=(arr,n)=>{for(let i=0;i<n&&arr.length;i++){const j=Math.floor(Math.random()*arr.length);chosen.push(arr.splice(j,1)[0]);}};
  take(inv,Math.round(k*viewShare));take(out,k-chosen.length);take(inv,k-chosen.length);
  return chosen;
}
function scheduleCrowd(dt){
  const prog=1-G.timeLeft/PLAY_TIME;
  const scaredMode=G.hits+G.misses>=14;
  const alive=crowd.people.filter(p=>p.alive);
  const raised=alive.filter(p=>p.isRaised()).length;
  if(raised===0)G.noRaiseT+=dt;else G.noRaiseT=0;
  if(G.noRaiseT>2.6&&G.waveT>1.2)G.waveT=0.4;
  G.spawnT-=dt;
  if(G.spawnT<=0){
    G.spawnT=rnd(2.4,3.8);
    const c=pickTargets(1,0.6);
    if(c.length){const p=c[0];
      if(Math.random()<0.62)p.start('raise',{hold:lerp(4.2,3.0,prog)*rnd(0.85,1.15),hes:scaredMode&&Math.random()<0.5});
      else{const opts=['scratch','wave','half','fix'];if(prog>0.3)opts.push('stretch');p.start(pick(opts));}}
  }
  if(G.timeLeft<=8&&!G.finalDone)G.waveT=0;
  G.waveT-=dt;
  if(G.waveT<=0){
    G.waveN++;
    let k,hold;
    if(G.timeLeft<=8&&!G.finalDone){G.finalDone=true;k=portrait?12:15;hold=9;G.waveT=999;}
    else{k=Math.round(lerp(4,6,prog))+(Math.random()<0.4?1:0);hold=lerp(4.8,3.1,prog);G.waveT=rnd(7.2,8.8);}
    const chosen=pickTargets(k,0.7);
    chosen.forEach((p,i)=>{setTimeout(()=>{if(p.alive&&!p.action&&G.state==='play')p.start('raise',{hold:hold*rnd(0.85,1.15),hes:scaredMode&&Math.random()<0.45});},i*90+rnd(0,350));});
    if(Math.random()<0.45){const dec=pickTargets(1,0.8);if(dec.length)setTimeout(()=>{if(dec[0].alive&&!dec[0].action&&G.state==='play')dec[0].start(pick(['stretch','scratch','wave']));},rnd(200,900));}
  }
  for(const p of alive)if(p.scared>0)p.scared-=dt;
}

async function countBoardValue(el,getTarget,suffix,duration,basePitch,tok){
  if(!el)return false;
  el.textContent='0'+suffix;await sleep(120);if(tok!==G.token)return false;
  const first=getTarget();
  if(first===0){el.textContent='0'+suffix;return true;}
  const steps=Math.max(7,Math.min(10,Math.abs(first)));
  for(let i=1;i<=steps;i++){
    if(tok!==G.token)return false;
    el.textContent=Math.round(getTarget()*i/steps)+suffix;
    sUi(basePitch+i*34);
    await sleep(duration/steps);
  }
  return true;
}
async function countBoard(tok){
  G.boardReady=false;
  if(!await countBoardValue($('#deadN'),()=>G.hits+G.misses+G.postKills,'',680,560,tok))return false;
  await sleep(100);if(tok!==G.token)return false;
  if(!await countBoardValue($('#wrongN'),()=>G.misses,'',500,720,tok))return false;
  await sleep(100);if(tok!==G.token)return false;
  if(!await countBoardValue($('#resultScore'),()=>G.score,'',620,880,tok))return false;
  G.boardReady=true;updateBoardNumbers();sDing();return true;
}
async function runEnding(){
  const tok=++G.token;const alive=()=>tok===G.token;
  stopSpeech();
  G.state='endTalk';document.body.classList.remove('playing-round');updateFinalCountdown(0);hintEl.classList.remove('on');crossEl.classList.remove('on');fireEl.classList.remove('on','down');aimPtrs.clear();unlockPointer();cv.style.cursor='crosshair';
  clearRemark();
  edgeL.classList.remove('on');edgeR.classList.remove('on');
  crowd.people.forEach(p=>{p.action=null;p.look=null;p.scared=0;});
  murmurTo(0,0.3);
  await sleep(650);if(!alive())return;
  hudEl.classList.remove('on');ammoEl.classList.remove('on');blackEl.classList.add('on');
  await sleep(80);if(!alive())return;
  speaker.mode='spread';setShot('reverse');blackEl.classList.remove('on');
  await sceneSpeech('크크, 농담입니다.',{rate:1.02,pitch:1.1},
    ()=>{if(alive()){setPhase('joke');jokeOn('ㅋㅋ 농담입니다.');}},1600);if(!alive())return;
  await sceneSpeech('삶의 의미 같은 건 없구요, 아무나 죽인 거였습니다~',{rate:1.02,pitch:1.1},
    ()=>{if(alive())jokeUpdate('삶의 의미 같은 건 없구요 아무나 죽인 거였습니다~~^^');},4200);if(!alive())return;
  captionOff();
  const survivors=crowd.people.filter(p=>p.alive);
  survivors.forEach(p=>{p.laughing=true;p.laughFace=Math.random()<0.55?FACE.laughB:FACE.laughA;});
  speaker.mode='laugh';setShot('over');
  G.state='endLaugh';
  sLaugh(Math.min(16,survivors.length)+1,9);if(survivors.length>0)sApplause(8,0.35);
  kkLoop(tok,survivors.length);
  buildBoard();
  await sleep(900);if(!alive())return;
  boardEl.classList.add('on');
  if(!await countBoard(tok)||!alive())return;
  await sleep(550);if(!alive())return;
  $('#againBox').classList.add('on');
}
async function kkLoop(tok,n){
  const glyphs=n>0?['ㅋ','ㅋ','ㅋ','ㄱ','ㄲ','ㅋ','ㄱ','ㅣ']:['ㅋ'];
  const lines=n>0?(portrait?6:3):1,per=n>0?(portrait?12:22):6;
  const rows=[];for(let r=0;r<lines;r++){const d=document.createElement('div');kkEl.appendChild(d);rows.push(d);}
  for(let r=0;r<lines;r++)for(let i=0;i<per;i++){
    if(tok!==G.token)return;
    rows[r].textContent+=(i%9===8&&n>0)?' ':pick(glyphs);
    await sleep(n>0?55:180);
  }
}

$('#start').addEventListener('click',()=>{audioInit();sStart();findVoice();lockPointer();runIntro();unlockSpeech();});
$('#again').addEventListener('click',()=>{audioInit();sRack();findVoice();lockPointer();runIntro();unlockSpeech();});
$('#mute').addEventListener('click',e=>{e.stopPropagation();setMuted(!A.muted);});
$('#mute').classList.toggle('off',A.muted);
ammoEl.addEventListener('click',e=>{e.stopPropagation();if(G.state==='play'&&G.ammo<MAG)startReload();});
window.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'||e.key==='ㄱ'){if(G.state==='play'&&G.ammo<MAG)startReload();}
  if(e.key==='m'||e.key==='M'||e.key==='ㅡ'){setMuted(!A.muted);}
});

/* ================= input ================= */
const cv=renderer.domElement;
let locked=false;
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;cv.style.cursor=locked?'none':(G.state==='play'?'default':'crosshair');});
document.addEventListener('pointerlockerror',()=>{locked=false;});
function lookDelta(dx,dy,sens){cam.yawT=clamp(cam.yawT-dx*sens,-YAW_MAX,YAW_MAX);cam.pitchT=clamp(cam.pitchT-dy*sens,PITCH_MIN,PITCH_MAX);}
const canShoot=()=>G.state==='play'||G.state==='endLaugh';
const aiming=()=>G.state==='play'&&cam.mode==='pov';
const touchSens=()=>(IS_TOUCH?1.55:1.4)/Math.max(320,W);
// 조준 손가락: 여러 개 동시에 받음. 드래그는 조준만 하고 절대 쏘지 않음.
const aimPtrs=new Map();
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(locked){if(canShoot())fire(W/2,H/2);return;}
  if(G.state==='endLaugh'){fire(e.clientX,e.clientY);return;}
  if(G.state!=='play')return;
  aimPtrs.set(e.pointerId,{x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t0:e.timeStamp,drag:false,btn:false});
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
});
function aimMove(e){
  const a=aimPtrs.get(e.pointerId);if(!a)return;
  const dx=e.clientX-a.x,dy=e.clientY-a.y;a.x=e.clientX;a.y=e.clientY;
  if(!a.drag&&Math.hypot(e.clientX-a.x0,e.clientY-a.y0)>6)a.drag=true;
  if(a.drag&&aiming())lookDelta(dx,dy,touchSens());
}
cv.addEventListener('pointermove',e=>{
  if(locked){if(G.state==='play')lookDelta(e.movementX||0,e.movementY||0,0.0016);return;}
  aimMove(e);
});
function aimEnd(e){
  const a=aimPtrs.get(e.pointerId);if(!a)return;
  aimPtrs.delete(e.pointerId);
  try{e.target.releasePointerCapture(e.pointerId);}catch(err){}
  if(a.btn){fireEl.classList.remove('down');return;}
  if(G.state!=='play')return;
  // 모바일은 드래그로만 조준하고 탕 버튼으로 발사. 데스크톱 클릭 발사는 유지한다.
  const desktopPointer=e.pointerType==='mouse'||(!e.pointerType&&!IS_TOUCH);
  if(!a.drag&&desktopPointer&&e.timeStamp-a.t0<350)fire(W/2,H/2);
  if(!a.drag&&desktopPointer&&!locked)lockPointer();
}
cv.addEventListener('pointerup',aimEnd);
cv.addEventListener('pointercancel',e=>{aimPtrs.delete(e.pointerId);});
// 탕 버튼: 누르는 순간 발사, 누른 채로 끌면 그 손가락으로도 조준
const fireEl=$('#fire');
fireEl.addEventListener('contextmenu',e=>e.preventDefault());
fireEl.addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();
  if(G.state!=='play')return;
  fireEl.classList.add('down');
  aimPtrs.set(e.pointerId,{x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t0:e.timeStamp,drag:false,btn:true});
  try{fireEl.setPointerCapture(e.pointerId);}catch(err){}
  fire(W/2,H/2);
});
fireEl.addEventListener('pointermove',aimMove);
fireEl.addEventListener('pointerup',aimEnd);
fireEl.addEventListener('pointercancel',e=>{aimPtrs.delete(e.pointerId);fireEl.classList.remove('down');});

/* ================= loop ================= */
let clockT=0,lastNow=performance.now();
function pausePage(){
  if(pagePaused)return;
  pagePaused=true;aimPtrs.clear();fireEl.classList.remove('down');
  stopSpeech();
  if(A.ctx&&A.ctx.state==='running')A.ctx.suspend().catch(()=>{});
}
function resumePage(){
  if(!pagePaused)return;
  pagePaused=false;pageResumeSeq++;lastNow=performance.now();
  if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume().catch(()=>{});
  if('speechSynthesis' in window)try{speechSynthesis.resume();}catch(e){}
}
document.addEventListener('visibilitychange',()=>document.hidden?pausePage():resumePage());
window.addEventListener('pagehide',pausePage);
window.addEventListener('pageshow',()=>{if(!document.hidden)resumePage();});
document.addEventListener('pointerdown',()=>{if(!document.hidden&&A.ctx&&A.ctx.state==='suspended')A.ctx.resume().catch(()=>{});},{capture:true});
function frame(now){
  const rdt=Math.min(0.05,(now-lastNow)/1000);lastNow=now;
  let dt=rdt;if(G.freeze>0){G.freeze-=rdt;dt=0;}
  clockT+=dt;
  if(G.state==='play'){
    if(G.timerStarted){
      G.timeLeft-=rdt;const tl=Math.max(0,Math.ceil(G.timeLeft));timerEl.textContent='남은 시간 '+tl;updateFinalCountdown(tl);
      if(tl<=10){timerEl.classList.add('low');if(tl<G.lastTick&&tl>0)sTimer(tl);}G.lastTick=tl;
      scheduleCrowd(dt);
      const alive=crowd.people.filter(p=>p.alive).length;
      // A nearly empty crowd starts the final countdown instead of skipping straight to the ending.
      if(alive<=Math.max(4,crowd.N*0.08)&&G.timeLeft>10)G.timeLeft=10;
      if(G.timeLeft<=0){G.timeLeft=0;runEnding();}
    }
  }else if(G.state==='title'){
    G.spawnT-=dt;if(G.spawnT<=0){G.spawnT=rnd(0.5,1.2);const f=crowd.people.filter(p=>!p.action);if(f.length){const p=pick(f);p.start(pick(['scratch','wave','fix','half','raise','clap']));}}
  }
  for(const p of crowd.people)p.update(dt,clockT);
  syncCrowd();
  speakerUpdate(dt,clockT);
  updateCamera(rdt);
  vmUpdate(rdt,dt);
  updateGunFlash(flashPOV,rdt);updateGunFlash(flashSpeaker,rdt);
  updateParticles(dt);updateCasings(dt);updateMagDrops(dt);
  dropMat.uniforms.uScale.value=(H*DPR)/(2*Math.tan(camera.fov*PI/360));
  updateBubbles();updateEdge();updateCaption();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
W=window.innerWidth;H=window.innerHeight;
portrait=layoutPortrait();
buildCrowd(portrait);
resize();setShot('over');setAmmo();
requestAnimationFrame(frame);
window.__G=G;window.__cam=camera;window.__camS=cam;window.__fire=fire;window.__crowd=()=>crowd;window.__runIntro=runIntro;window.__runEnding=runEnding;window.__setShot=setShot;window.__VM=VM;window.__speaker=speaker;
window.__look=(y,p)=>{cam.yaw=cam.yawT=y;cam.pitch=cam.pitchT=p;};window.__reload=startReload;
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{
  const bt=stageGroup.userData.whiteboardTex;if(bt){paintLectureBoard(bt.image,portrait);bt.needsUpdate=true;}});
})();
