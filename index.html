<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>삶의 의미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#232323; --graphite:#6d6d6d; --red:#d9101a;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);overflow:hidden}
body{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;cursor:crosshair}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}

.halo{text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff,0 0 10px #fff}
#caption{position:fixed;left:calc(var(--safe-l) + max(16px,3.2vw));top:calc(var(--safe-t) + max(14px,2.6vh));
  max-width:min(15.5em,calc(100vw - 150px));font-size:clamp(20px,3.5vw,40px);line-height:1.38;font-weight:500;
  letter-spacing:-0.01em;white-space:pre-line;word-break:keep-all;pointer-events:none;opacity:0}
#caption.on{opacity:1}
#hud{position:fixed;right:calc(var(--safe-r) + max(14px,2.4vw));top:calc(var(--safe-t) + max(12px,2.2vh));
  text-align:right;pointer-events:none;opacity:0;transition:opacity .2s}
#hud.on{opacity:1}
#score{font-size:clamp(20px,2.6vw,30px);font-weight:900;letter-spacing:-0.02em}
#score.hurt{animation:hurt .35s}
@keyframes hurt{0%,100%{transform:none;color:var(--ink)}25%{transform:translateX(-5px);color:var(--red)}60%{transform:translateX(4px);color:var(--red)}}
#timer{font-size:clamp(14px,1.6vw,18px);font-weight:700;color:var(--ink);margin-top:2px}
#hint{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) rotate(-1.5deg);background:#fff;border:4px solid var(--ink);
  box-shadow:7px 7px 0 var(--ink);padding:.35em .8em .4em;white-space:nowrap;
  font-size:clamp(28px,5.4vw,60px);font-weight:900;letter-spacing:-0.03em;line-height:1.2;pointer-events:none;display:none}
#hint.on{display:block;animation:hintIn .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes hintIn{0%{transform:translate(-50%,-50%) rotate(-1.5deg) scale(.3)}100%{transform:translate(-50%,-50%) rotate(-1.5deg) scale(1)}}

.pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(22px,3vw,34px);
  animation:pop .9s ease-out forwards;white-space:nowrap}
.pop.good{color:var(--ink)} .pop.bad{color:var(--red)} .pop.zero{color:var(--graphite)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.tang{position:absolute;font-weight:500;font-size:clamp(22px,3.4vw,40px);transform:translate(-50%,-50%) rotate(var(--r));
  animation:tang .55s ease-out forwards;white-space:nowrap}
@keyframes tang{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(.7)}20%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-90%) rotate(var(--r)) scale(1)}}
.flash{position:absolute;width:90px;height:90px;transform:translate(-50%,-50%) rotate(var(--r));animation:flash .12s steps(2) forwards}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid var(--ink);border-radius:14px 14px 14px 3px;
  padding:4px 10px;font-size:clamp(13px,1.5vw,17px);font-weight:500;white-space:nowrap}

#kk{position:fixed;left:calc(var(--safe-l) + 2vw);right:calc(var(--safe-r) + 2vw);top:calc(var(--safe-t) + 1.5vh);
  font-size:clamp(24px,4.6vw,56px);line-height:1.2;font-weight:400;letter-spacing:.02em;word-break:break-all;pointer-events:none}

#board{position:fixed;right:calc(var(--safe-r) + 4vw);bottom:calc(var(--safe-b) + max(96px,15vh));transform:rotate(-1.2deg);background:#fff;border:3px solid var(--ink);
  padding:18px 26px 16px;min-width:min(86vw,360px);pointer-events:none;opacity:0;transition:opacity .3s;
  box-shadow:6px 6px 0 var(--ink)}
#board.on{opacity:1}
#board .row{display:flex;justify-content:space-between;gap:24px;font-size:clamp(16px,2vw,20px);font-weight:500;padding:3px 0}
#board .row b{font-weight:900;font-variant-numeric:tabular-nums}
#board .sum{border-top:2px solid var(--ink);margin-top:8px;padding-top:8px;font-size:clamp(22px,3vw,30px)}
#board .sum b{font-size:1.25em}
#board .red{color:var(--red)}

#title{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-start;
  padding:calc(var(--safe-t) + max(28px,7vh)) calc(var(--safe-r) + 6vw) calc(var(--safe-b) + 6vh) calc(var(--safe-l) + 6vw);
  background:linear-gradient(180deg,rgba(255,255,255,.94) 0%,rgba(255,255,255,.86) 55%,rgba(255,255,255,0) 100%);transition:opacity .35s}
#title.off{opacity:0;pointer-events:none}
#title h1{margin:0 0 6px;font-size:clamp(48px,11vw,128px);font-weight:900;letter-spacing:-0.045em;line-height:1}
#title p{margin:14px 0 0;font-size:clamp(16px,2.1vw,22px);font-weight:500;line-height:1.55;max-width:34em}
#title p.sub{color:var(--graphite);font-size:clamp(13px,1.5vw,16px);margin-top:6px}
.btn{margin-top:26px;align-self:flex-start;font:inherit;font-size:clamp(18px,2.2vw,24px);font-weight:900;color:var(--ink);background:#fff;
  border:3px solid var(--ink);padding:12px 28px;box-shadow:5px 5px 0 var(--ink);cursor:pointer;transform:rotate(-1deg)}
.btn:active{transform:translate(4px,4px) rotate(-1deg);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--red);outline-offset:4px}
#again{position:fixed;right:calc(var(--safe-r) + 4vw);bottom:calc(var(--safe-b) + max(24px,4vh));transform:rotate(-1deg);margin:0;display:none}
#again:active{transform:translate(4px,4px) rotate(-1deg)}
#again.on{display:block}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fx"></div>
<div id="kk" class="halo"></div>
<div id="caption" class="halo"></div>
<div id="hud" class="halo"><div id="score">점수 0</div><div id="timer"></div></div>
<div id="hint" class="halo"></div>
<div id="board"></div>
<button id="again" class="btn">다시 물어보기</button>
<div id="title">
  <h1>삶의 의미</h1>
  <button id="start" class="btn">시작하기</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sleep=ms=>new Promise(r=>{let left=ms,last=performance.now();const f=()=>{const n=performance.now();if(!window.__freeze)left-=n-last;last=n;if(left<=0)r();else setTimeout(f,Math.min(40,Math.max(4,left)));};setTimeout(f,Math.min(40,ms));});

/* ================= renderer ================= */
const DPR=Math.min(window.devicePixelRatio||1,2);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(DPR);
renderer.setClearColor(0xffffff,1);
$('#stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,1,0.05,90);
let W=1,H=1;

const U={
  uLight:{value:new THREE.Vector3(-0.35,0.75,0.75).normalize()},
  uDpr:{value:DPR},
  uInk:{value:new THREE.Color('#232323')},
  uPaper:{value:new THREE.Color('#ffffff')},
  uRed:{value:new THREE.Color('#d9101a')}
};
const LIGHT_CROWD=new THREE.Vector3(-0.35,0.75,0.75).normalize();
const LIGHT_SPEAKER=new THREE.Vector3(0.4,0.8,-0.65).normalize();

/* ================= shaders ================= */
const hatchVS=`
#ifdef INST
attribute float aTone; attribute float aHit; attribute vec2 aSeed;
#endif
uniform float uTone;
varying vec3 vN; varying float vTone; varying vec3 vLocal; varying float vHit; varying vec2 vSeed;
void main(){
  vec4 p=vec4(position,1.0); vec3 n=normal;
  #ifdef USE_INSTANCING
  p=instanceMatrix*p; n=mat3(instanceMatrix)*n;
  #endif
  vec4 wp=modelMatrix*p;
  vN=normalize(mat3(modelMatrix)*n);
  vLocal=position;
  #ifdef INST
  vTone=aTone; vHit=aHit; vSeed=aSeed;
  #else
  vTone=uTone; vHit=0.0; vSeed=vec2(0.0);
  #endif
  gl_Position=projectionMatrix*viewMatrix*wp;
}`;
const hatchFS=`
uniform vec3 uLight; uniform float uDpr; uniform vec3 uInk; uniform vec3 uPaper; uniform vec3 uRed;
varying vec3 vN; varying float vTone; varying vec3 vLocal; varying float vHit; varying vec2 vSeed;
float hl(float c,float sp,float w){ float d=abs(fract(c/sp)-0.5)*sp; return 1.0-smoothstep(w*0.5,w*0.5+0.9,d); }
void main(){
  vec3 n=normalize(vN); if(!gl_FrontFacing) n=-n;
  float diff=max(dot(n,normalize(uLight)),0.0);
  float light=clamp(diff*0.7+0.36+0.1*n.y,0.0,1.0);
  float dark=clamp((1.0-light)*0.72+vTone,0.0,1.0);
  vec2 p=gl_FragCoord.xy/uDpr;
  float wob=sin(p.y*0.045)*2.2+sin(p.x*0.031)*1.6;
  float ink=0.0;
  ink=max(ink,hl(p.x+p.y+wob,6.5,1.05)*smoothstep(0.27,0.34,dark));
  ink=max(ink,hl(p.x-p.y+wob,6.5,1.05)*smoothstep(0.5,0.57,dark));
  ink=max(ink,hl(p.x*0.35+p.y+wob,4.4,1.25)*smoothstep(0.7,0.77,dark));
  ink=max(ink,smoothstep(0.86,0.98,dark)*0.92);
  vec3 base=uPaper;
  if(vHit>0.0){
    vec2 c=vec2(vSeed.x*0.07,0.36+vSeed.y*0.06);
    vec2 d=vLocal.xy-c;
    float ang=atan(d.y,d.x);
    float r=(0.085+0.025*sin(ang*5.0+vSeed.x*9.0)+0.015*sin(ang*11.0+vSeed.y*7.0))*vHit;
    float front=step(0.0,vLocal.z);
    float m=(1.0-smoothstep(r-0.012,r,length(d)))*front;
    float dx=vLocal.x-c.x-0.03*sin(vSeed.y*20.0);
    float drip=(1.0-smoothstep(0.009,0.014,abs(dx)))*step(vLocal.y,c.y)*step(c.y-0.26*vHit,vLocal.y)*front;
    float dx2=vLocal.x-c.x+0.045*cos(vSeed.x*17.0);
    float drip2=(1.0-smoothstep(0.007,0.011,abs(dx2)))*step(vLocal.y,c.y)*step(c.y-0.15*vHit,vLocal.y)*front;
    m=max(m,max(drip,drip2));
    base=mix(base,uRed,m);
    ink*=(1.0-0.55*m);
  }
  gl_FragColor=vec4(mix(base,uInk,ink*0.95),1.0);
}`;
const outlineVS=`
uniform float uW;
void main(){
  float k=0.75+0.5*(0.5+0.5*sin(position.x*23.0+position.y*17.0+position.z*29.0));
  vec3 pos=position+normal*uW*k;
  vec4 p=vec4(pos,1.0);
  #ifdef USE_INSTANCING
  p=instanceMatrix*p;
  #endif
  gl_Position=projectionMatrix*viewMatrix*modelMatrix*p;
}`;
const outlineFS=`uniform vec3 uInk; void main(){ gl_FragColor=vec4(uInk,1.0); }`;
const faceVS=`
#ifdef INST
attribute float aFace;
#endif
uniform float uFace;
varying vec2 vUv;
void main(){
  #ifdef INST
  float f=aFace;
  #else
  float f=uFace;
  #endif
  vec2 cell=vec2(mod(f,4.0),3.0-floor(f/4.0));
  vUv=(uv+cell)/4.0;
  vec4 p=vec4(position,1.0);
  #ifdef USE_INSTANCING
  p=instanceMatrix*p;
  #endif
  gl_Position=projectionMatrix*viewMatrix*modelMatrix*p;
}`;
const faceFS=`uniform sampler2D uMap; varying vec2 vUv;
void main(){ vec4 t=texture2D(uMap,vUv); if(t.a<0.35) discard; gl_FragColor=vec4(t.rgb,1.0); }`;

function hatchMat(inst,tone){
  const m=new THREE.ShaderMaterial({
    uniforms:{uLight:U.uLight,uDpr:U.uDpr,uInk:U.uInk,uPaper:U.uPaper,uRed:U.uRed,uTone:{value:tone||0}},
    vertexShader:hatchVS,fragmentShader:hatchFS,side:THREE.FrontSide
  });
  if(inst) m.defines={INST:''};
  return m;
}
const outlineMats={};
function outlineMat(w){
  if(outlineMats[w]) return outlineMats[w];
  return outlineMats[w]=new THREE.ShaderMaterial({uniforms:{uW:{value:w},uInk:U.uInk},vertexShader:outlineVS,fragmentShader:outlineFS,side:THREE.BackSide});
}

/* ================= textures ================= */
function scribble(ctx,pts,width,passes){
  passes=passes||3;
  for(let k=0;k<passes;k++){
    ctx.beginPath();
    for(let i=0;i<pts.length;i++){
      const x=pts[i][0]+rnd(-1.4,1.4),y=pts[i][1]+rnd(-1.4,1.4);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.lineWidth=width*rnd(0.7,1.1); ctx.stroke();
  }
}
function arcPts(cx,cy,rx,ry,a0,a1,n){const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}return p;}
function dot(ctx,x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();for(let k=0;k<2;k++){ctx.beginPath();ctx.arc(x+rnd(-1,1),y+rnd(-1,1),r*0.9,0,Math.PI*2);ctx.stroke();}}

const faceTex=(function(){
  const S=256,cv=document.createElement('canvas');cv.width=cv.height=S*4;
  const c=cv.getContext('2d');
  c.strokeStyle='#232323';c.fillStyle='#232323';c.lineCap='round';c.lineJoin='round';
  const draw=[
    // 0 dot eyes, flat mouth
    (x,y)=>{dot(c,x+96,y+122,8);dot(c,x+160,y+122,8);scribble(c,[[x+112,y+176],[x+128,y+178],[x+146,y+175]],4);},
    // 1 zigzag mouth (comic)
    (x,y)=>{dot(c,x+96,y+120,8);dot(c,x+160,y+120,8);scribble(c,[[x+104,y+172],[x+114,y+182],[x+124,y+170],[x+134,y+182],[x+144,y+170],[x+154,y+180]],4);},
    // 2 small circle eyes, o mouth
    (x,y)=>{scribble(c,arcPts(x+96,y+120,10,11,0,6.4,14),4);scribble(c,arcPts(x+160,y+120,10,11,0,6.4,14),4);dot(c,x+97,y+122,4);dot(c,x+161,y+122,4);scribble(c,arcPts(x+128,y+178,9,11,0,6.4,14),4);},
    // 3 glasses
    (x,y)=>{scribble(c,arcPts(x+94,y+120,20,17,0,6.4,18),4);scribble(c,arcPts(x+162,y+120,20,17,0,6.4,18),4);scribble(c,[[x+114,y+118],[x+142,y+118]],4);dot(c,x+95,y+121,6);dot(c,x+161,y+121,6);scribble(c,[[x+110,y+180],[x+146,y+178]],4);},
    // 4 laugh ^^ + open mouth
    (x,y)=>{scribble(c,[[x+80,y+128],[x+96,y+110],[x+112,y+128]],5);scribble(c,[[x+144,y+128],[x+160,y+110],[x+176,y+128]],5);
      c.beginPath();c.moveTo(x+96,y+160);c.quadraticCurveTo(x+128,y+168,x+160,y+160);c.quadraticCurveTo(x+150,y+214,x+128,y+214);c.quadraticCurveTo(x+106,y+214,x+96,y+160);c.fill();
      scribble(c,[[x+96,y+160],[x+128,y+166],[x+160,y+160]],4);},
    // 5 crazy laugh >< + huge mouth + tears
    (x,y)=>{scribble(c,[[x+78,y+104],[x+108,y+118],[x+80,y+134]],5);scribble(c,[[x+178,y+104],[x+148,y+118],[x+176,y+134]],5);
      scribble(c,[[x+80,y+140],[x+76,y+158]],3);scribble(c,[[x+178,y+140],[x+182,y+160]],3);
      c.beginPath();c.moveTo(x+86,y+154);c.quadraticCurveTo(x+128,y+146,x+170,y+154);c.quadraticCurveTo(x+168,y+232,x+128,y+234);c.quadraticCurveTo(x+88,y+232,x+86,y+154);c.fill();
      c.fillStyle='#fff';c.fillRect(x+100,y+158,56,10);c.fillStyle='#232323';},
    // 6 dead X X
    (x,y)=>{for(const ex of [96,160]){scribble(c,[[x+ex-12,y+108],[x+ex+12,y+132]],5);scribble(c,[[x+ex+12,y+108],[x+ex-12,y+132]],5);}
      scribble(c,arcPts(x+128,y+184,12,9,0,6.4,14),4);},
    // 7 sad
    (x,y)=>{scribble(c,[[x+80,y+112],[x+110,y+120]],4);scribble(c,[[x+176,y+112],[x+146,y+120]],4);dot(c,x+96,y+132,6);dot(c,x+160,y+132,6);
      scribble(c,[[x+104,y+186],[x+116,y+178],[x+128,y+186],[x+140,y+178],[x+152,y+186]],4);scribble(c,[[x+96,y+142],[x+94,y+162]],3);},
    // 8 yawn
    (x,y)=>{scribble(c,[[x+82,y+122],[x+110,y+124]],5);scribble(c,[[x+146,y+124],[x+174,y+122]],5);c.beginPath();c.ellipse(x+128,y+184,15,22,0,0,Math.PI*2);c.fill();},
    // 9 speaker talk
    (x,y)=>{dot(c,x+100,y+118,8);dot(c,x+156,y+118,8);scribble(c,arcPts(x+128,y+176,13,15,0,6.4,16),4);c.beginPath();c.ellipse(x+128,y+178,8,10,0,0,6.3);c.fill();},
    // 10 speaker angry
    (x,y)=>{scribble(c,[[x+80,y+98],[x+114,y+114]],6);scribble(c,[[x+176,y+98],[x+142,y+114]],6);dot(c,x+100,y+124,7);dot(c,x+156,y+124,7);
      c.lineWidth=4;c.beginPath();c.rect(x+96,y+164,64,28);c.stroke();
      for(let i=1;i<6;i++)scribble(c,[[x+96+i*10.6,y+164],[x+96+i*10.6,y+192]],3,1);scribble(c,[[x+96,y+178],[x+160,y+178]],3,1);},
    // 11 speaker smile
    (x,y)=>{dot(c,x+100,y+116,8);dot(c,x+156,y+116,8);scribble(c,arcPts(x+128,y+158,34,26,0.35,2.8,16),5);},
    // 12 surprised
    (x,y)=>{scribble(c,arcPts(x+96,y+118,14,15,0,6.4,16),4);scribble(c,arcPts(x+160,y+118,14,15,0,6.4,16),4);dot(c,x+96,y+120,5);dot(c,x+160,y+120,5);scribble(c,arcPts(x+128,y+184,7,9,0,6.4,12),4);},
    // 13 serious brows
    (x,y)=>{scribble(c,[[x+80,y+104],[x+112,y+106]],5);scribble(c,[[x+144,y+106],[x+176,y+104]],5);dot(c,x+96,y+124,7);dot(c,x+160,y+124,7);scribble(c,[[x+110,y+182],[x+146,y+182]],4);},
    // 14 tired half lids
    (x,y)=>{scribble(c,[[x+82,y+116],[x+110,y+116]],4);scribble(c,[[x+146,y+116],[x+174,y+116]],4);dot(c,x+96,y+124,6);dot(c,x+160,y+124,6);scribble(c,[[x+114,y+180],[x+144,y+184]],4);},
    // 15 dash eyes smile
    (x,y)=>{scribble(c,[[x+84,y+122],[x+108,y+122]],5);scribble(c,[[x+148,y+122],[x+172,y+122]],5);scribble(c,arcPts(x+128,y+168,18,12,0.4,2.7,10),4);}
  ];
  draw.forEach((f,i)=>{const x=(i%4)*S,y=Math.floor(i/4)*S;c.save();f(x,y);c.restore();});
  // speaker's zigzag hairline (comic) on his own faces
  for(const i of [9,10,11]){const x=(i%4)*S,y=Math.floor(i/4)*S;const z=[];for(let k=0;k<=9;k++)z.push([x+62+k*14.7,y+(k%2?58:84)+rnd(-3,3)]);scribble(c,z,5);}
  const t=new THREE.CanvasTexture(cv);t.anisotropy=4;return t;
})();

function makeRig(){
  const r={root:new THREE.Object3D(),legs:new THREE.Object3D(),body:new THREE.Object3D(),torso:new THREE.Object3D(),

  r.root.add(r.legs);r.root.add(r.body);r.body.position.y=0.86;r.body.add(r.torso);
  r.neck.position.y=0.7;r.body.add(r.neck);r.head.position.y=0.19;r.head.scale.setScalar(1.25);r.neck.add(r.head);
  for(const side of [1,-1]){
    const sh=new THREE.Object3D();sh.position.set(side*0.235,0.56,0);r.body.add(sh);
    const up=new THREE.Object3D();sh.add(up);

    const fo=new THREE.Object3D();el.add(fo);

function applyPose(r,p){
  const A=[p.L,p.R];
  r.arms.forEach((a,i)=>{const q=A[i];a.sh.rotation.set(q.sx,0,a.side*q.sz);a.el.rotation.set(q.ex,0,a.side*q.ez);});

function ikArm(r,arm,target,w){
  // two-bone IK in body space, blended in by w
  const L1=0.31,L2=0.3;
  const Tl=r.body.worldToLocal(target.clone());
  const S=arm.sh.position.clone();
  const v=Tl.clone().sub(S);let d=v.length();v.normalize();
  d=clamp(d,0.08,L1+L2-0.004);
  const a1=Math.acos(clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1));
  const pole=new THREE.Vector3(arm.side*0.6,-1,-0.35).normalize();
  const pp=pole.clone().sub(v.clone().multiplyScalar(pole.dot(v))).normalize();
  const u=v.clone().multiplyScalar(Math.cos(a1)).add(pp.multiplyScalar(Math.sin(a1)));
  const E=S.clone().add(u.clone().multiplyScalar(L1));
  const f=S.clone().add(v.clone().multiplyScalar(d)).sub(E).normalize();
  const down=new THREE.Vector3(0,-1,0);
  const q1=new THREE.Quaternion().setFromUnitVectors(down,u);
  const fl=f.clone().applyQuaternion(q1.clone().invert());
  const q2=new THREE.Quaternion().setFromUnitVectors(down,fl);
  arm.sh.quaternion.slerp(q1,w);arm.el.quaternion.slerp(q2,w);
}
function speakerUpdate(dt,t){
  const S=speaker,P=S.tgt,C=S.cur,r=S.rig;
  const micArm=armP(-0.95,-0.25,-1.95,0);
  setArm(P.L,armP(0,0.12,-0.15,0));setArm(P.R,armP(0,0.12,-0.15,0));P.lean=0;P.tilt=0;P.pitch=0;P.yaw=0;P.roll=0;P.bob=0;
  let face=FACE.smile;
  if(S.mode==='raise'){setArm(P.L,micArm);setArm(P.R,armP(-0.1,2.75,-0.2,0.35+Math.sin(t*3)*0.06));P.tilt=0.04;face=S.talk>0?(Math.floor(t*9)%2?FACE.talk:FACE.smile):FACE.smile;}
  else if(S.mode==='mic'||S.mode==='aim'){setArm(P.L,micArm);face=S.talk>0?(Math.floor(t*9)%2?FACE.talk:FACE.smile):FACE.smile;}
  else if(S.mode==='angry'){setArm(P.L,armP(0,0.2,-0.2,0));face=FACE.angry;P.lean=0.08;}
  else if(S.mode==='reload'){setArm(P.L,armP(-0.3,0.25,-0.5,0));setArm(P.R,armP(-1.05,-0.32,-1.5,0));face=FACE.angry;P.lean=0.05;P.pitch=0.12;}
  else if(S.mode==='spread'){setArm(P.L,armP(-0.15,1.35+Math.sin(t*4)*0.08,-0.1,-0.25));setArm(P.R,armP(-0.1,2.75,-0.05,0.3+Math.sin(t*5)*0.1));P.tilt=-0.14;P.roll=0.22;P.lean=-0.05;face=S.talk>0&&Math.floor(t*9)%2?FACE.talk:FACE.smile;}
  else if(S.mode==='laugh'){const k=t*8;setArm(P.L,armP(-0.1,1.4+Math.sin(k)*0.3,-0.2,0.3));setArm(P.R,armP(-0.1,2.4+Math.cos(k)*0.3,-0.2,0.2));P.bob=Math.abs(Math.sin(k))*0.05;P.lean=-0.1+Math.sin(k*0.5)*0.1;P.pitch=-0.25;face=FACE.laughA;}
  if(S.mode==='aim'||S.mode==='angry') P.lean+=0;
  const k=1-Math.exp(-10*dt);
  lerpArm(C.L,P.L,k);lerpArm(C.R,P.R,k);for(const key of ['lean','tilt','yaw','pitch','roll','bob']) C[key]=lerp(C[key],P[key],k);
  applyPose(r,C);
  if(S.mode==='aim'||S.mode==='angry'){
    // right arm points at aim target
    const a=r.arms[1];
    r.root.updateMatrixWorld(true);
    const shW=new THREE.Vector3().setFromMatrixPosition(a.sh.matrixWorld);
    const dir=S.aim.clone().sub(shW).normalize();
    const bodyQ=new THREE.Quaternion();r.body.getWorldQuaternion(bodyQ);
    const local=dir.applyQuaternion(bodyQ.clone().invert());
    const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,-1,0),local);
    if(S.recoil>0){const rq=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0).applyQuaternion(q),0);q.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(-S.recoil*0.5,0,0)));}
    if(!S.hasAim){S.aimQ.copy(a.sh.quaternion);S.hasAim=true;}
    S.aimQ.slerp(q,1-Math.exp(-(S.mode==='angry'?20:26)*dt));
    a.sh.quaternion.copy(S.aimQ);a.el.rotation.set(0,0,0);
  }else S.hasAim=false;
  // slide rack: left hand grabs the slide, pulls it back, lets go
  let slideOff=0;
  if(S.mode==='reload'){
    if(!window.__freezeRel)S.relT+=dt;const T=S.relT;
    const w=T<0.32?0:T<0.55?(T-0.32)/0.23:T<0.82?1:T<1.1?1-(T-0.82)/0.28:0;
    if(T>=0.55&&T<0.68)slideOff=0.065*(T-0.55)/0.13;else if(T>=0.68&&T<0.72)slideOff=0.065;else if(T>=0.72&&T<0.75)slideOff=0.065*(1-(T-0.72)/0.03);

    if(w>0){r.root.updateMatrixWorld(true);const tw=new THREE.Vector3();S.grab.getWorldPosition(tw);ikArm(r,r.arms[0],tw,w);}
    if(!S.racked&&T>=0.56){S.racked=true;sRack();}
    if(!S.clacked&&T>=0.72){S.clacked=true;shake=0.6;const gp=new THREE.Vector3();S.slide.getWorldPosition(gp);const g=toScreen(gp);
      fxDiv('tang halo',g.x+rnd(40,70),g.y-rnd(50,80),'철컥',700,{'--r':rnd(-14,-4)+'deg'});}
  }else{S.slide.position.y=0;}
  S.gun.rotation.y=lerp(S.gun.rotation.y,S.mode==='reload'?-PI/2:0,1-Math.exp(-14*dt));
  S.recoil=Math.max(0,S.recoil-dt*6);
  if(S.recoil>0.6)S.slide.position.y=0.05*(S.recoil-0.6)/0.4;
  S.gun.visible=S.mode==='aim'||S.mode==='angry'||S.mode==='reload';
  S.mic.visible=S.mode!=='laugh'&&S.mode!=='reload'&&S.mode!=='angry';
  {const R=r.arms[1],L=r.arms[0];
   R.fist.visible=S.gun.visible;R.open.visible=!S.gun.visible;
   const lf=S.mic.visible||(S.mode==='reload'&&S.relT>0.5&&S.relT<0.86);L.fist.visible=lf;L.open.visible=!lf;}
  S.face.material.uniforms.uFace.value=face;
  if(S.talk>0)S.talk-=dt;
}

let portrait=false,shot='over',shake=0;

function crowdBoundsPts(){
  const pts=[],c=crowd;if(!c)return pts;
  const hw=c.width/2-1.2;
  for(const r of [0,c.rows-1]){
    const z=-0.7-r*1.18,y=-0.5+r*0.33;
    for(const x of [-hw,hw]){pts.push(new THREE.Vector3(x+0.15,y+0.1,z));pts.push(new THREE.Vector3(x+0.15,y+1.95,z));}
  }
  // raised hand height at back
  const rb=c.rows-1;pts.push(new THREE.Vector3(0,-0.5+rb*0.33+2.4,-0.7-rb*1.18));
  return pts;
}
function fitFov(pos,look,pts,xm,ytop,ybot){
  const cam=new THREE.PerspectiveCamera(50,W/H,0.05,90);cam.position.copy(pos);cam.lookAt(look);
  let lo=20,hi=110;
  for(let it=0;it<22;it++){
    const f=(lo+hi)/2;cam.fov=f;cam.updateProjectionMatrix();cam.updateMatrixWorld();
    let ok=true;
    for(const p of pts){const v=p.clone().project(cam);if(Math.abs(v.x)>xm||v.y>ytop||v.y<ybot){ok=false;break;}}
    if(ok)hi=f;else lo=f;
  }
  return hi;
}
function setShot(name){

    for(let it=0;it<4;it++){
      camBase.fov=fitFov(camBase.pos,camBase.look,bp,0.96,yt,yb);
      const cam=new THREE.PerspectiveCamera(camBase.fov,W/H,0.05,90);cam.position.copy(camBase.pos);cam.lookAt(camBase.look);cam.updateMatrixWorld();
      let lo=9,hi=-9;for(const p of bp){const v=p.clone().project(cam);lo=Math.min(lo,v.y);hi=Math.max(hi,v.y);}
      const off=((hi+lo)/2-(yt+yb)/2);
      camBase.look.y+=off*Math.tan(camBase.fov*PI/360)*camBase.pos.distanceTo(camBase.look)*0.9;
    }

    camBase.pos.set(sp.x+0.2,1.3,sp.z-d);camBase.look.set(sp.x,1.3,sp.z);camBase.fov=portrait?56:46;
  }

function makeClapBuffer(C){

    if(!p.alive&&G.state!=='endLaugh')continue;
    if(!p.alive)continue;
    for(const [v,wgt] of p.screenPoints()){
      const s=toScreen(v);if(s.z>1)continue;
      const d=v.distanceTo(camera.position);
      const rpx=0.17*p.s/(d*tanH)*(H/2);
      const score=Math.hypot(s.x-sx,s.y-sy)/Math.max(rpx,6)*wgt;
      if(score<bs){bs=score;best=p;}
    }
  }
  return bs<1.7?best:null;
}
const ray=new THREE.Raycaster();
function aimPointFromScreen(sx,sy){
  ray.setFromCamera(new THREE.Vector2(sx/W*2-1,-(sy/H)*2+1),camera);
  return ray.ray.origin.clone().add(ray.ray.direction.clone().multiplyScalar(7));
}
function fire(sx,sy){
  const now=performance.now();if(now-G.lastFire<170)return;G.lastFire=now;
  const target=pickTarget(sx,sy);
  let aimAt;
  if(target){
    // aim at the part nearest the tap
    let best=null,bd=1e9;for(const [v] of target.screenPoints()){const s=toScreen(v);const d=Math.hypot(s.x-sx,s.y-sy);if(d<bd){bd=d;best=v;}}
    aimAt=best;
  }else aimAt=aimPointFromScreen(sx,sy);
  speaker.aim.copy(aimAt);
  // snap arm for accuracy
  speaker.hasAim=false;speakerUpdate(0.001,clockT);
  const a=speaker.rig.arms[1];speaker.rig.root.updateMatrixWorld(true);
  const shW=new THREE.Vector3().setFromMatrixPosition(a.sh.matrixWorld);
  const dir=aimAt.clone().sub(shW).normalize();const bq=new THREE.Quaternion();speaker.rig.body.getWorldQuaternion(bq);
  speaker.aimQ.setFromUnitVectors(new THREE.Vector3(0,-1,0),dir.applyQuaternion(bq.invert()));speaker.hasAim=true;
  a.sh.quaternion.copy(speaker.aimQ);speaker.rig.root.updateMatrixWorld(true);
  speaker.recoil=1;shake=1;
  sGun();
  const mz=toScreen(new THREE.Vector3().setFromMatrixPosition(speaker.muzzle.matrixWorld));
  fxDiv('flash',mz.x,mz.y,flashSVG,130,{'--r':rnd(0,360)+'deg'});
  fxDiv('tang halo',mz.x+rnd(-30,30),mz.y-rnd(30,60),'탕',560,{'--r':rnd(-18,18)+'deg'});
  if(!target)return;
  const correct=target.isRaised();
  target.kill();target.fall.wrong=!correct;
  sHit();sFall(rnd(0.35,0.5));
  const chest=new THREE.Vector3().setFromMatrixPosition(target.rig.torso.matrixWorld);chest.y+=0.36*target.s;
  const away=chest.clone().sub(camera.position).setY(0).normalize();
  spray(chest,away,26,target.floorY+0.02);
  const hs=toScreen(new THREE.Vector3().setFromMatrixPosition(target.rig.head.matrixWorld).add(new THREE.Vector3(0,0.25,0)));
  crowd.people.forEach(o=>{if(o!==target&&o.alive&&!o.laughing){const d=o.rig.root.position.distanceTo(target.rig.root.position);
    if(d<1.9&&Math.random()<0.8){const dx=target.rig.root.position.x-o.rig.root.position.x;o.look={t:rnd(0.9,1.6),yaw:clamp(dx*1.2,-1.1,1.1)};}}});
  if(G.state==='endLaugh'){fxDiv('pop zero halo',hs.x,hs.y,'0',900);return;}
  if(correct){G.score+=5;G.hits++;sDing();fxDiv('pop good halo',hs.x,hs.y,'+5',900);remark(REM_GOOD);}
  else{G.score-=10;G.misses++;sBuzz();fxDiv('pop bad halo',hs.x,hs.y,'−10',900);bubbleOn(target,pick(LAST_WORDS),1500);
    scoreEl.classList.remove('hurt');void scoreEl.offsetWidth;scoreEl.classList.add('hurt');remark(REM_BAD,true);}
  setScore();
  // occasional clapping from bystanders
  if(Math.random()<0.35){const al=crowd.people.filter(p=>p.alive&&!p.action);for(let k=0;k<2&&al.length;k++)pick(al).start('clap');}
}

function scheduleCrowd(dt){
  const prog=1-G.timeLeft/PLAY_TIME;
  G.spawnT-=dt;
  const alive=crowd.people.filter(p=>p.alive);
  const raised=alive.filter(p=>p.isRaised()).length;
  if(raised===0)G.noRaiseT+=dt;else G.noRaiseT=0;
  if(G.noRaiseT>3.6){G.noRaiseT=0;remark(REM_IDLE,true);
    const free=alive.filter(p=>!p.action);for(let k=0;k<3&&free.length;k++){const p=free.splice(Math.floor(Math.random()*free.length),1)[0];setTimeout(()=>{if(p.alive&&!p.action&&G.state==='play')p.start('raise');},k*250+500);}}
  if(G.spawnT<=0){
    G.spawnT=lerp(0.95,0.38,prog)*rnd(0.6,1.3);
    const free=alive.filter(p=>!p.action&&!p.look);if(!free.length)return;
    const p=pick(free);
    const r=Math.random();
    const raiseP=lerp(0.62,0.45,prog);
    if(r<raiseP) p.start('raise',{hold:lerp(2.6,1.15,prog)*rnd(0.8,1.2)});
    else{
      const opts=['scratch','wave','half','fix'];if(prog>0.25)opts.push('stretch','scratch');if(prog>0.5)opts.push('half','stretch');
      p.start(pick(opts));
    }
  }
}

/* ================= sequences ================= */
function layoutPortrait(){return W/H<0.9;}
function resize(){
  W=window.innerWidth;H=window.innerHeight;renderer.setSize(W,H,false);
  const pNow=layoutPortrait();
  if(G.state==='title'&&pNow!==portrait){portrait=pNow;buildCrowd(portrait);}
  portrait=pNow;
  setShot(shot);
}
window.addEventListener('resize',resize);

function resetGame(){
  G.score=0;G.hits=0;G.misses=0;G.timeLeft=PLAY_TIME;G.spawnT=1;G.noRaiseT=0;G.lastRemark=0;
  setScore();timerEl.textContent='';
  bubbles.length=0;fxEl.innerHTML='';kkEl.textContent='';boardEl.classList.remove('on');boardEl.innerHTML='';
  $('#again').classList.remove('on');
  pPos.fill(-999);pLife.fill(0);
  portrait=layoutPortrait();buildCrowd(portrait);
  speaker.mode='mic';
}
async function runIntro(){
  const tok=++G.token;const alive=()=>tok===G.token;
  resetGame();
  G.state='intro';
  $('#title').classList.add('off');hudEl.classList.remove('on');
  speaker.mode='raise';setShot('front');
  sFeedback();murmurTo(0,0.2);
  await sleep(450);if(!alive())return;
  const q='나는 삶의 의미를 모르겠다 하시는 분 계시나요?';
  setPhase('q');caption(q);say('나는 삶의 의미를 모르겠다 하시는 분, 계시나요?',{rate:1.0});
  await sleep(3200);if(!alive())return;
  captionOff();speaker.mode='mic';setShot('over');murmurTo(0.02,0.3);setPhase('hands');
  const ppl=crowd.people.slice().sort(()=>Math.random()-0.5);
  const n=Math.floor(ppl.length*0.3);
  for(let k=0;k<n;k++){const p=ppl[k];setTimeout(()=>{if(alive()&&p.alive&&!p.action)p.start('raise',{hold:rnd(4.0,5.6)});},rnd(150,1100));}
  await sleep(2000);if(!alive())return;
  speaker.mode='reload';speaker.relT=0;speaker.racked=false;speaker.clacked=false;setShot('close');murmurTo(0,0.1);setPhase('reload');
  await sleep(1250);if(!alive())return;
  speaker.mode='angry';speaker.aim.copy(camBase.pos);
  setPhase('angry');caption('그럼 죽어!');say('그럼 죽어!',{rate:1.2,pitch:0.8});
  await sleep(1300);if(!alive())return;
  captionOff();speaker.mode='aim';speaker.aim.set(0,1.2,-4);setShot('over');
  hudEl.classList.add('on');murmurTo(0.03,0.6);
  hintEl.innerHTML='손 든 사람을 쏘세요';hintEl.classList.add('on');
  setTimeout(()=>{if(alive())hintEl.classList.remove('on');},2800);
  G.state='play';
}
async function runEnding(){
  const tok=++G.token;const alive=()=>tok===G.token;
  G.state='endTalk';hintEl.classList.remove('on');
  crowd.people.forEach(p=>{p.action=null;p.look=null;});
  await sleep(700);if(!alive())return;
  hudEl.classList.remove('on');
  speaker.mode='spread';setShot('wide');murmurTo(0,0.2);
  setPhase('joke');caption('ㅋㅋ 농담입니다 삶의 의미 같은 건 없구요 아무나 죽인 거였습니다~~^^');
  say('크크, 농담입니다. 삶의 의미 같은 건 없구요, 아무나 죽인 거였습니다~',{rate:1.02,pitch:1.1});
  await sleep(4600);if(!alive())return;
  captionOff();
  const survivors=crowd.people.filter(p=>p.alive);
  survivors.forEach(p=>{p.laughing=true;p.laughFace=Math.random()<0.55?FACE.laughB:FACE.laughA;});
  speaker.mode='laugh';setShot('over');
  G.state='endLaugh';
  sLaugh(Math.min(16,survivors.length)+1,9);if(survivors.length>0)sApplause(8,0.35);
  kkLoop(tok,survivors.length);
  const good=G.hits*5,bad=G.misses*10;
  boardEl.innerHTML=`<div class="row"><span>죽은 사람</span><b>${G.hits+G.misses}명</b></div>
    <div class="row red"><span>삶의 의미를 아는데 죽은 사람</span><b>${G.misses}명</b></div>
    <div class="row sum"><span>점수</span><b id="bs">${G.score}</b></div>`;
  await sleep(900);if(!alive())return;
  boardEl.classList.add('on');
  await sleep(1700);if(!alive())return;
  const t0=performance.now(),dur=1100;
  const tick=()=>{if(!alive())return;const k=clamp((performance.now()-t0)/dur,0,1),e=1-k;
    $('#bs').textContent=Math.round(G.score*e);
    if(k<1)requestAnimationFrame(tick);};
  tick();
  await sleep(4200);if(!alive())return;
  $('#again').classList.add('on');
}
async function kkLoop(tok,n){
  const glyphs=n>0?['ㅋ','ㅋ','ㅋ','ㄱ','ㄲ','ㅋ','ㄱ','ㅣ']:['ㅋ'];
  const lines=n>0?(portrait?6:3):1,per=n>0?(portrait?12:22):6;
  const rows=[];for(let r=0;r<lines;r++){const d=document.createElement('div');kkEl.appendChild(d);rows.push(d);}
  for(let r=0;r<lines;r++)for(let i=0;i<per;i++){
    if(tok!==G.token)return;
    rows[r].textContent+=(i%9===8&&n>0)?' ':pick(glyphs);
    await sleep(n>0?55:180);
  }
}

$('#start').addEventListener('click',()=>{audioInit();findVoice();runIntro();});
$('#again').addEventListener('click',()=>{audioInit();runIntro();});

/* ================= input ================= */
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{
  if(G.state!=='play'&&G.state!=='endLaugh')return;
  e.preventDefault();
  fire(e.clientX,e.clientY);
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;
  if(G.state!=='play'&&G.state!=='endLaugh')return;
  if(speaker.mode!=='aim'&&speaker.mode!=='laugh')return;
  if(speaker.mode==='aim')speaker.aim.copy(aimPointFromScreen(e.clientX,e.clientY));
});

/* ================= loop ================= */
let clockT=0,lastNow=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-lastNow)/1000);lastNow=now;clockT+=dt;
  if(G.state==='play'){
    G.timeLeft-=dt;timerEl.textContent='남은 시간 '+Math.max(0,Math.ceil(G.timeLeft));
    scheduleCrowd(dt);
    const alive=crowd.people.filter(p=>p.alive).length;
    if(G.timeLeft<=0||alive<=Math.max(4,crowd.N*0.08)){G.timeLeft=0;runEnding();}
  }else if(G.state==='title'){
    // idle crowd behaviour on the title screen
    G.spawnT-=dt;if(G.spawnT<=0){G.spawnT=rnd(0.5,1.2);const f=crowd.people.filter(p=>!p.action);if(f.length){const p=pick(f);p.start(pick(['scratch','wave','fix','half','raise','clap']));}}
  }
  for(const p of crowd.people)p.update(dt,clockT);
  syncCrowd();
  speakerUpdate(dt,clockT);
  updateParticles(dt);
  updateCamera(dt);
  updateBubbles();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
W=window.innerWidth;H=window.innerHeight;
portrait=layoutPortrait();
buildCrowd(portrait);
resize();setShot('over');
requestAnimationFrame(frame);
window.__G=G;window.__stepReload=(T)=>{window.__freezeRel=false;speaker.relT=T-0.02;speaker.mode='reload';for(let i=0;i<40;i++)speakerUpdate(0.0005,clockT);for(let i=0;i<30;i++){window.__freezeRel=true;speakerUpdate(0.05,clockT);}};window.__T={Gm,hatchMat,outlineMat,renderer,scene,M};window.__cam=camera;window.__fire=fire;window.__crowd=()=>crowd;window.__runIntro=runIntro;window.__runEnding=runEnding;
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{/* banner uses fonts */
  const bt=stageGroup.userData.bannerTex;const c=bt.image.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,1400,360);c.strokeStyle='#232323';c.lineWidth=10;c.strokeRect(14,14,1372,332);c.lineWidth=3;c.strokeRect(34,34,1332,292);
  c.fillStyle='#232323';c.textAlign='center';c.textBaseline='middle';
  c.font="900 170px 'Noto Sans KR','Noto Sans CJK KR',sans-serif";c.fillText('삶의 의미란?',700,188);bt.needsUpdate=true;});
